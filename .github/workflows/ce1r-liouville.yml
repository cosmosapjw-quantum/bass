name: CE1-R BASS Rust observer-sky Liouville derivative
on:
  pull_request:
    branches: [research/bass-ce1q-observer-sky-20261030-r1]
    paths:
      - 'research/ce1r_20261030/**'
      - '.github/workflows/ce1r-liouville.yml'
  push:
    branches: [research/bass-ce1r-liouville-rust-sky-20261030-r1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ce1r-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-liouville:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      BASS_CE1R_RUST: /tmp/ce1r_native
      BASS_CE1Q_PARENT: research/ce1q_20261030/parent_verified
      BASS_CE1Q_CE1P_SOURCE: research/ce1p_20261029/source/generate_physical_history.py
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - name: Pin unchanged real BASS kinetic code and exact six-cell Python source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84
          test "$(git hash-object bianchi/nonperturbative/einstein_tabulated_source.py)" = fdeb83a65cd424786ba6bb8ddadbcb2b2e2d45bf
          test "$(git hash-object research/ce1q_20261030/sky_native.rs)" = 3663e6f9b88f7547f87d0cb2004a5e24636f77d7
      - name: Frozen Python oracle and plotting-free science requirements
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Compile BASS Rust Frame-linked original sky and new proper-time Liouville CLI
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustc +1.94.1 --edition=2021 -C opt-level=2 -A dead_code research/ce1q_20261030/sky_native.rs -o /tmp/ce1q_native
          rustc +1.94.1 --edition=2021 -C opt-level=2 -A dead_code research/ce1r_20261030/sky_time_derivative.rs -o /tmp/ce1r_native
          /tmp/ce1q_native --selftest
          /tmp/ce1r_native --selftest
      - name: Independent synthetic six-cell physics and malicious-source gates
        run: |
          set -euo pipefail
          mkdir -p /tmp/ce1r_evidence
          python research/ce1r_20261030/verify_liouville.py --synthetic --out /tmp/ce1r_evidence/synthetic.json --csv-out /tmp/ce1r_evidence/synthetic.csv
      - name: Real stored ref8/ref16 and physical GL24/GL40 41-epoch time derivative atlas
        shell: bash
        run: |
          set -euo pipefail
          for channel in stored_ref8 stored_ref16 gl24 gl40; do
            python research/ce1r_20261030/verify_liouville.py --channel "$channel" --out "/tmp/ce1r_evidence/${channel}.json" --csv-out "/tmp/ce1r_evidence/${channel}.csv"
          done
      - name: Static program package compile
        run: python -m compileall -q research/ce1r_20261030
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CE1R-BASS-RUST-LIOUVILLE-CANDIDATE
          path: /tmp/ce1r_evidence
          if-no-files-found: warn
