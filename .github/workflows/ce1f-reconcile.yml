name: CE1-F exact stored energy and variant reconciliation
on:
  push:
    branches: [research/bass-ce1f-reconcile-energycap-20261029-r1]
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_tabulated_source.py
      - tests/nonperturbative/test_ce1f_energy_cap_reconciliation.py
      - research/ce1f_reconcile_20261029/**
      - .github/workflows/ce1f-reconcile.yml
permissions:
  contents: read
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Verify exact-energy contract and 47 inherited regressions
        run: >
          python -m pytest -q
          tests/nonperturbative/test_ce1f_energy_cap_reconciliation.py
          tests/nonperturbative/test_einstein_tabulated_source.py
          tests/nonperturbative/test_einstein_exponential_source.py
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py
      - name: Cross-compare pinned sibling with corrected CE1-F on same physics
        run: python research/ce1f_reconcile_20261029/compare_variants.py /tmp/ce1f_comparison.json | tee /tmp/ce1f_comparison.log
      - name: Installed wheel exact stored-energy contract
        run: |
          python -m pip wheel --no-deps . -w /tmp/ce1f-wheel
          python -m pip install --no-deps --target /tmp/ce1f-installed /tmp/ce1f-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1f-installed python - <<'PY'
          from decimal import Decimal, localcontext
          from fractions import Fraction
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation,certified_tabulated_geometry
          s=TabulatedRadiation(('0','1'),('0','1'),(('0.9',),),backend='python_oracle')
          r=certified_tabulated_geometry(s)
          with localcontext() as ctx:
              ctx.prec=110
              m=Fraction.from_float(float(s.mass[0]));n=sum((Fraction.from_float(float(q))**2 for q in s.n[0]),Fraction())
              exact=Decimal(m.numerator)/Decimal(m.denominator)*(Decimal(n.numerator)/Decimal(n.denominator)).sqrt()
              assert Decimal.from_float(r['energy_max_upper'])>=exact
          print('WHEEL_EXACT_STORED_ENERGY_CAP_PASS')
          PY
      - name: Keep comparison evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ce1f-reconcile-evidence
          path: |
            /tmp/ce1f_comparison.json
            /tmp/ce1f_comparison.log
          if-no-files-found: warn
          retention-days: 30
