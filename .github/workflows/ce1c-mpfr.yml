name: CE1C directed MPFR error budget
on:
  push:
    branches: [research/bass-ce1c-mpfr-geometry-tolerance-20261028]
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_interval.py
      - tests/nonperturbative/test_einstein_interval.py
permissions:
  contents: read
jobs:
  scoped-interval:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.4.0
      - name: Exact binary interval tests and parent integration tests
        run: python -m pytest tests/nonperturbative/test_einstein_interval.py tests/nonperturbative/test_einstein_error_budget.py -q
      - name: Installed wheel MPFR interval smoke
        run: |
          python -m pip wheel --no-deps . -w /tmp/bass-ce1c-wheel
          python -m pip install --no-deps --target /tmp/bass-ce1c-install /tmp/bass-ce1c-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/bass-ce1c-install python - <<'PY'
          from bianchi.nonperturbative.einstein_interval import Interval
          from fractions import Fraction
          z=Interval.decimal('0.1')+Interval.decimal('0.2')
          assert Fraction.from_float(z.lower)<=Fraction(3,10)<=Fraction.from_float(z.upper)
          print('INSTALLED_WHEEL_MPFR_INTERVAL_PASS; native NOT_RUN')
          PY
