name: CE1-U exact-rational six-cell GL coupled Einstein-Vlasov science
on:
  push:
    branches: [research/bass-ce1u-rational-continuum-gl-coupled-20261030-r1]
  pull_request:
    branches: [research/bass-ce1t-original-cell-gl-rust-20261030-r1]
    paths:
      - 'research/ce1u_20261030/**'
      - '.github/workflows/ce1u-exact-rational-gl-science.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ce1u-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.13.5'}
      - name: Pin original frozen BASS source and kinetic code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/ce1t_20261030/cellwise_gl_rust.py)" = 6d254e9efc95acc1fd2079bd047d40662986d135
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84
      - name: Install scoped Python test/physics stack
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.7
      - name: Recompute full-domain exact-rational source proofs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ce1u
          python research/ce1u_20261030/source/ce1u_cert_source.py --order 6 --K 12 --output /tmp/ce1u/GL6_source_exact_bound.json
          python research/ce1u_20261030/source/ce1u_cert_source.py --order 8 --K 12 --output /tmp/ce1u/GL8_source_exact_bound.json
          python - <<'PY'
          import json
          from pathlib import Path
          for n in (6,8):
              a=json.loads(Path(f'/tmp/ce1u/GL{n}_source_exact_bound.json').read_text())
              b=json.loads(Path(f'research/ce1u_20261030/data/GL{n}_source_exact_bound.json').read_text())
              assert a['maximum_epsilon_source_exact']==b['maximum_epsilon_source_exact']
              assert a['stored_gl_hashes']==b['stored_gl_hashes']
          print('CE1U_EXACT_RATIONAL_SOURCE_REPRODUCED')
          PY
      - name: Generate new coupled 82-row physical histories and test exact source
        shell: bash
        run: |
          set -euo pipefail
          python research/ce1u_20261030/source/ce1u_physical_histories.py --out /tmp/ce1u
          python - <<'PY'
          import csv
          from pathlib import Path
          for n in (6,8):
              a=list(csv.DictReader(Path(f'/tmp/ce1u/GL{n}_coupled_41epochs.csv').open()))
              b=list(csv.DictReader(Path(f'research/ce1u_20261030/data/GL{n}_coupled_41epochs.csv').open()))
              assert len(a)==len(b)==41
              assert max(abs(float(x['h1'])-float(y['h1'])) for x,y in zip(a,b))<2e-12
          print('CE1U_COUPLED_PHYSICAL_82_ROWS_REGENERATED')
          PY
      - name: True directed MPFR-192 source evaluation at frozen knots
        run: python research/ce1u_20261030/source/ce1u_mpfr192_knots.py --output /tmp/ce1u/MPFR192_source_knots.json
      - name: Scientific pytest and static compilation
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q research/ce1u_20261030/tests/test_ce1u_science.py
          python -m compileall -q research/ce1u_20261030/source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CE1U-FROZEN-SOURCE-COUPLED-PHYSICAL-RESULTS
          path: /tmp/ce1u
          if-no-files-found: error
