name: CE1-AF original six-cell shear-quadrupole photon stress transfer
on:
  push:
    branches: [research/bass-ce1af-original-quadrupole-shear-work-20261030-r1]
  pull_request:
    paths:
      - 'research/ce1af_20261030/**'
      - '.github/workflows/ce1af-physical-shear-quadrupole.yml'
jobs:
  original_physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned physics runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Original exact six-cell initial shear work rational certificate
        run: python research/ce1af_20261030/source/certify_initial_shear_work.py
      - name: Generate 1604 original self-consistent Einstein-Vlasov physical shear quadrupole states
        run: python research/ce1af_20261030/source/shear_work_physics.py
      - name: Run 24 physically scoped original-source and adversarial tests
        run: python -m pytest -q research/ce1af_20261030/source/test_ce1af.py
      - name: Render scientific physical plots
        run: python research/ce1af_20261030/source/plot_ce1af.py
      - name: Compile source code
        run: python -m compileall -q research/ce1af_20261030/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AF_ORIGINAL_SIXCELL_SHEAR_QUADRUPOLE_PHYSICAL_EVIDENCE
          path: |
            research/ce1af_20261030/data/
            research/ce1af_20261030/figures/
            research/ce1af_20261030/THEORY_KO.md
            research/ce1af_20261030/REPORT_KO.md
          if-no-files-found: error
