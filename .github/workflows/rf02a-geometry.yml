name: RF-02A geometry authority

on:
  pull_request:
    paths:
      - "audit/r4_bianchi_constraints.py"
      - "audit/run_all.py"
      - "audit/manifest.json"
      - "bianchi/algebra.py"
      - "bianchi/symbolic/**"
      - "_rustcore/src/geom/**"
      - "tests/test_rf02a_geometry_authority.py"
      - "tests/test_q1_group.py"
      - "tests/test_rf00_route_inventory.py"
      - ".github/workflows/rf02a-geometry.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf02a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.94.1"
  MATURIN_VERSION: "1.14.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  symbolic-authority:
    name: Exact Jacobi reduction and fail-closed gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python inputs
        run: python -m pip install --requirement requirements.lock
      - name: Prove RF-02A symbolic closure only
        env:
          PYTHONPATH: .:audit
          PIP_NO_INDEX: "1"
          CARGO_NET_OFFLINE: "true"
        run: |
          python -m pytest -q tests/test_rf02a_geometry_authority.py
          python audit/r4_bianchi_constraints.py > "$RUNNER_TEMP/rf02a-r4.json"
          python - "$RUNNER_TEMP/rf02a-r4.json" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding="utf-8").read()
          payload = json.loads(text[text.index("{"):])
          assert payload["aggregate_gate"]["pass"] is True
          assert payload["bianchi_identity_reduced_vanishes"] is True
          assert payload["mutation_witness"]["ndot_H_sign_flip"]["reduced_vanishes"] is False
          PY

  native-geometry-routes:
    name: Native-required algebra and curvature routes
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Setup pinned Rust and Python inputs
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --no-self-update
          rustup override set "$RUST_TOOLCHAIN"
          python -m pip install --requirement requirements.lock "maturin==$MATURIN_VERSION"
          cargo fetch --manifest-path _rustcore/Cargo.toml --locked
      - name: Build focused native route closure
        working-directory: _rustcore
        env:
          CARGO_NET_OFFLINE: "true"
        run: python -m maturin build --release --locked --offline --out "$RUNNER_TEMP/rf02a-wheel"
      - name: Prove only RF-02A route selectors
        env:
          PYTHONPATH: .
          PIP_NO_INDEX: "1"
          CARGO_NET_OFFLINE: "true"
        run: |
          python -m pip install --no-index "$RUNNER_TEMP"/rf02a-wheel/bianchi_rustcore-*.whl .
          python -m pytest -q tests/test_q1_group.py tests/test_rf00_route_inventory.py
