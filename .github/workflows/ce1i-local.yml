name: CE1-I time-local pressure Jacobian scoped research
on:
  push:
    branches: [research/bass-ce1i-time-local-jacobian-20261029-r1]
  pull_request:
    branches: [research/bass-ce1h-sharp-pressure-jacobian-20261029]
permissions:
  contents: read
concurrency:
  group: ce1i-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-math-code:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install exact scoped Python dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: CE1-I new plus inherited CE1-H/G/F targeted physical regressions
        run: >-
          python -m pytest -q
          tests/nonperturbative/test_einstein_tabulated_local.py
          tests/nonperturbative/test_einstein_tabulated_sharp.py
          tests/nonperturbative/test_einstein_tabulated_time.py
          tests/nonperturbative/test_einstein_tabulated_source.py
          tests/nonperturbative/test_einstein_exponential_source.py
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py
      - name: Installed wheel CE1-I source and local-bound execution
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1i-wheels
          python -m pip install --no-deps --target /tmp/ce1i-wheel /tmp/ce1i-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1i-wheel python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_local import run_local_tabulated_rk4
          s = TabulatedRadiation([0,.5,1],[0,.25,.75,1],[[.1,.25,.05],[.2,.15,.15]],
                                 refinement=1,backend='python_oracle')
          r = run_local_tabulated_rk4(s,steps=2,end=.02,backend='python_oracle')
          assert r['local_total_ell_h_upper'][1] < r['ce1h_total_ell_h_upper'][1]
          assert not r['production_ready'] and not r['full_machine_proof']
          print('CE1I_INSTALLED_WHEEL_SCOPED_PASS')
          PY
