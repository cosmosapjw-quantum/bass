name: BG-02 Component Oracle and Native Bridge RED

on:
  push:
    branches:
      - research/bass-master-ssot-v2-bg02-einstein-projection-implementation-red-20260904-r1
  pull_request:
    paths:
      - "docs/bass_master_ssot_v2/BG_02_IMPLEMENTATION/**"
      - "docs/superpowers/plans/2026-09-04-bg02-einstein-projection-implementation.md"
      - "docs/superpowers/plans/2026-09-04-bg02-native-gauss-codazzi-bridge.md"
      - "tests/test_bg02_einstein_projection_implementation.py"
      - "tests/test_bg02_native_bridge_adversarial.py"
      - "tests/test_bg02_red_wrapper_ancestry.py"
      - "scripts/run_bg02_native_bridge_adversarial_red.py"
      - "scripts/run_bg02_einstein_projection_red_local.sh"
      - "scripts/run_bg02_einstein_projection_source_green_local.sh"
      - "scripts/verify_bg02_einstein_projection_implementation.py"
      - "scripts/audit_bg02_cross_cas.py"
      - "tools/bg02/**"
      - "formal/lean/BG02OffShellIdentities.lean"
      - "wolfram/BASS/Kernel/Background/**"
      - "wolfram/BASS/Kernel/Geometry/GaussCodazziProjectionRules.wl"
      - "wolfram/BASS/Kernel/init.wl"
      - "wolfram/BASS/Tests/BG02*.wlt"
      - "wolfram/scripts/run_bg02_einstein_projection_native.wls"
      - ".github/workflows/bg02-einstein-projection-implementation.yml"

permissions:
  contents: read

jobs:
  component-oracle-native-bridge-red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify preserved RED wrapper ancestry policy
        shell: bash
        run: |
          python3 -S -m unittest -v tests.test_bg02_red_wrapper_ancestry

      - name: Verify named native-bridge adversarial RED
        shell: bash
        run: |
          python3 -S scripts/run_bg02_native_bridge_adversarial_red.py \
            artifacts/bg02_native_bridge_adversarial_red

      - name: Install available Python corroboration axes
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check \
            sympy==1.14.0 mpmath==1.3.0

      - name: Validate component oracle and scalar identities only
        shell: bash
        run: |
          bash scripts/run_bg02_einstein_projection_source_green_local.sh \
            artifacts/bg02_component_oracle

      - name: Upload component-oracle and adversarial-RED evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg02-component-oracle-native-bridge-red
          path: |
            artifacts/bg02_native_bridge_adversarial_red
            artifacts/bg02_component_oracle
          if-no-files-found: error
