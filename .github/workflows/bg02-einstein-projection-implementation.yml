name: BG-02 Einstein Projection Source GREEN Candidate

on:
  push:
    branches:
      - research/bass-master-ssot-v2-bg02-einstein-projection-implementation-red-20260904-r1
  pull_request:
    paths:
      - "docs/bass_master_ssot_v2/BG_02_IMPLEMENTATION/**"
      - "docs/superpowers/plans/2026-09-04-bg02-einstein-projection-implementation.md"
      - "tests/test_bg02_einstein_projection_implementation.py"
      - "tests/test_bg02_red_wrapper_ancestry.py"
      - "scripts/run_bg02_einstein_projection_red_local.sh"
      - "scripts/run_bg02_einstein_projection_source_green_local.sh"
      - "scripts/verify_bg02_einstein_projection_implementation.py"
      - "scripts/audit_bg02_cross_cas.py"
      - "tools/bg02/**"
      - "formal/lean/BG02OffShellIdentities.lean"
      - "wolfram/BASS/Kernel/Background/EinsteinProjection.wl"
      - "wolfram/BASS/Kernel/init.wl"
      - "wolfram/BASS/Tests/BG02EinsteinProjectionImplementation.wlt"
      - "wolfram/scripts/run_bg02_einstein_projection_native.wls"
      - ".github/workflows/bg02-einstein-projection-implementation.yml"

permissions:
  contents: read

jobs:
  source-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify preserved RED wrapper ancestry policy
        shell: bash
        run: |
          python3 -S -m unittest -v tests.test_bg02_red_wrapper_ancestry
      - name: Install available Python audit axes
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check sympy==1.14.0 mpmath==1.3.0
      - name: Run source-GREEN validation
        shell: bash
        run: |
          bash scripts/run_bg02_einstein_projection_source_green_local.sh \
            artifacts/bg02_einstein_projection_source_green
      - name: Upload source-GREEN evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bg02-einstein-projection-source-green
          path: artifacts/bg02_einstein_projection_source_green
          if-no-files-found: error
