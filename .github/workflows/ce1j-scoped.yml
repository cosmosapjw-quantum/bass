name: CE1-J scoped time-local source certificate
on:
  push:
    branches: [research/bass-ce1j-time-local-source-20261029]
    paths:
      - bianchi/nonperturbative/einstein_interval.py
      - bianchi/nonperturbative/einstein_tabulated_time.py
      - bianchi/nonperturbative/einstein_tabulated_local.py
      - bianchi/nonperturbative/einstein_tabulated_source_local.py
      - tests/nonperturbative/test_einstein_tabulated_local.py
      - tests/nonperturbative/test_einstein_tabulated_source_local.py
      - tests/nonperturbative/test_ce1j_source_identity_guards.py
      - .github/workflows/ce1j-scoped.yml
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_tabulated_source_local.py
      - tests/nonperturbative/test_einstein_tabulated_source_local.py
      - .github/workflows/ce1j-scoped.yml
permissions:
  contents: read
concurrency:
  group: ce1j-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Same-physics targeted CE1-J, CE1-I, CE1-H and inherited tests
        run: >
          python -m pytest -q
          tests/nonperturbative/test_einstein_tabulated_source_local.py
          tests/nonperturbative/test_ce1j_source_identity_guards.py
          tests/nonperturbative/test_einstein_tabulated_local.py
          tests/nonperturbative/test_einstein_tabulated_sharp.py
          tests/nonperturbative/test_einstein_tabulated_time.py
          tests/nonperturbative/test_einstein_tabulated_source.py
          tests/nonperturbative/test_einstein_exponential_source.py
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py
      - name: Installed wheel CE1-J source certification smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1j-wheels
          python -m pip install --no-deps --target /tmp/ce1j-wheel /tmp/ce1j-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1j-wheel python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_source_local import run_local_source_rk4
          s=TabulatedRadiation([0,.5,1],[0,.25,.75,1],[[.1,.25,.05],[.2,.15,.15]],refinement=1,backend='python_oracle')
          r=run_local_source_rk4(s,backend='python_oracle')
          assert r['ce1j']['total'][1] < r['ce1i']['total'][1]
          assert r['production_ready'] is False
          print('CE1J_WHEEL_SCOPED_PASS')
          PY
