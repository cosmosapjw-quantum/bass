name: CE1-L second hostile source-premise audit
on:
  push:
    branches: [research/bass-ce1l-r6c9-physical-lock-20261029-r1]
  pull_request:
    branches: [repair/bass-ce1k-shape-rf-ci-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1l-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-hostile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Scoped exact-binary oracle dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: CE1-L adversarial physical-input and signed-source contract plus inherited CE1 tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1l_physical_table_identity.py \
            tests/nonperturbative/test_ce1l_positive_stored_residual.py \
            tests/nonperturbative/test_ce1k_cardinality_contract.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_time.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_error_budget.py
      - name: Unchanged ref8 physical h budget vs pinned historical outputs
        run: |
          set -euo pipefail
          python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_local import run_local_tabulated_rk4
          source=TabulatedRadiation([0,.5,1],[0,.25,.75,1],
             [[.1,.25,.05],[.2,.15,.15]],refinement=8,backend='python_oracle')
          r=run_local_tabulated_rk4(source,steps=4,end=.08,backend='python_oracle')
          assert r['ce1g_total_ell_h_upper'][1]==1.2322918653868093e-5
          assert r['ce1h_total_ell_h_upper'][1]==1.227583245284329e-5
          assert r['local_total_ell_h_upper'][1]==1.2273903547843227e-5
          assert not r['target_met'] and not r['production_ready']
          print('CE1L_REF8_FROZEN_SCIENCE_IDENTITY_PASS')
          PY
      - name: Installed wheel rejects physical measure mutation and signed mass
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1l-wheel
          python -m pip install --no-deps --target /tmp/ce1l-installed /tmp/ce1l-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1l-installed python - <<'PY'
          import numpy as np
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation,certified_tabulated_energy
          from bianchi.nonperturbative.einstein_interval import stored_ray_energy_majorant
          s=TabulatedRadiation([0,1],[0,1],[[.9]],backend='python_oracle')
          s.cells=TabulatedRadiation([0,1],[0,1],[[1.]],backend='python_oracle').cells
          try:certified_tabulated_energy(s)
          except ValueError as e:assert 'physical' in str(e)
          else:raise AssertionError('mutated physical source accepted')
          b=TabulatedRadiation([0,.5,1],[0,1],[[.4],[.5]],backend='python_oracle')
          b.mass=np.array([100.,-99.])
          try:stored_ray_energy_majorant(b)
          except ValueError as e:assert 'Nonnegative' in str(e)
          else:raise AssertionError('signed positive-sum mass admitted')
          print('CE1L_INSTALLED_WHEEL_PREMISES_FAIL_CLOSED_PASS')
          PY
