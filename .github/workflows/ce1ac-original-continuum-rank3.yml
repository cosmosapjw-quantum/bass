name: CE1-AC original six-cell continuum l4 initial rank3 and new time data
on:
  push:
    branches:
      - research/bass-ce1ac-original-continuum-l4-initial-jet-rank3-20261030-r1
  pull_request:
    paths:
      - 'research/ce1ac_20261030/**'
      - '.github/workflows/ce1ac-original-continuum-rank3.yml'
permissions:
  contents: read
concurrency:
  group: ce1ac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-original-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin scientific environment
        run: python -m pip install 'numpy==2.3.5' 'scipy==1.17.0' 'pytest==9.0.2'
      - name: Verify frozen source, original saved histories and immutable parent
        run: |
          set -euo pipefail
          test "$(git hash-object research/ce1ac_20261030/original_source/cellwise_gl_rust.py)" = '6d254e9efc95acc1fd2079bd047d40662986d135'
          sha256sum research/ce1ac_20261030/input/GL6_DOP853_coupled_41epochs.csv | grep '^6eff8cd9f31d027bbee55720332302b6fbad71b3639b5809aab6b9ce6f53e489'
          sha256sum research/ce1ac_20261030/input/GL8_DOP853_coupled_41epochs.csv | grep '^1398980ec71662494273e05eb4bd52a78f6e6c7f208702638da6c739698f7502'
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = 'a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84'
      - name: New original continuum exact cell angular jet sign via integer outward intervals
        run: python research/ce1ac_20261030/source/initial_jet_certificate.py
      - name: New original frozen DOP853 82 l4 jets and 3362 two-time physical derivative records
        run: python research/ce1ac_20261030/source/l4_kinematic_history.py
      - name: Independent exact Fraction interval method for physical normalization and 35 moments
        run: python research/ce1ac_20261030/source/exact_jet_certificate.py
      - name: Independent GL6 8 16 64 initial jets, plus fresh GL16/64 coupled Einstein-Vlasov time histories
        run: |
          python research/ce1ac_20261030/source/jet_numeric.py
          python research/ce1ac_20261030/source/physical_rank3_history.py
      - name: Verify 34 scoped model, mathematics, and numerical physics tests
        run: |
          python -m pytest -q research/ce1ac_20261030/tests/test_scoped_physics.py research/ce1ac_20261030/source/test_ce1ac_science.py
          python -m compileall -q research/ce1ac_20261030/source research/ce1ac_20261030/tests
      - name: Preserve genuinely generated physical data and theorem witnesses
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_CE1AC_ORIGINAL_SIX_CELL_EXACT_RANK3_AND_REAL_TIME_DATA
          path: |
            research/ce1ac_20261030/data/
            research/ce1ac_20261030/THEORY_KO.md
            research/ce1ac_20261030/INDEPENDENT_CHECK_KO.md
            research/ce1ac_20261030/CLAIM_GATE.json
          if-no-files-found: warn
          retention-days: 60
