name: KM-2D time-varying electron tilt physical Bianchi I source memory
on:
  push:
    branches: [research/bass-km2d-accelerating-electron-tilt-20261030-r1]
  pull_request:
    branches: [research/bass-ce1aa-mpfr-two-epoch-minor-20261030-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  km2d-prescribed-acceleration-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Verify immutable original BASS KM2A-C physics and one bounded science contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/dual_lane_km2c_20261028/code/curved_tilt.py)" = 05aade3aab7e9a32c11608882c943e4d3cb6f379
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/tilted_collision.py)" = 92660768f4719d78261fed1cb44f186d2821629d
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/source_memory.py)" = 9d500e36fefaa4ddc22300a2f03d9eb9cfe98403
          git rev-parse HEAD
      - name: Create source-inclusive S0 checkpoint before physical computation
        run: |
          mkdir -p /tmp/km2d
          python research/dual_lane_km2d_20261030/package_artifacts.py \
            --stage S0 --output /tmp/km2d/BASS_KM2D_S0.zip
      - name: Upload S0 frozen original source and theoretical derivation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2D_S0_FROZEN_ORIGINAL
          path: /tmp/km2d/BASS_KM2D_S0.zip
          retention-days: 60
          if-no-files-found: error
      - name: Install exact scoped computational dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          python -m compileall -q research/dual_lane_km2d_20261030
      - name: Actually evolve variable-beta polarized photons and unknown-source memory
        run: |
          python research/dual_lane_km2d_20261030/accelerating_tilt.py \
            --output /tmp/km2d/physical_science.json
      - name: Preserve S1 physical source, original source code and actual scientific data
        run: |
          python research/dual_lane_km2d_20261030/package_artifacts.py \
            --stage S1 --results /tmp/km2d/physical_science.json \
            --output /tmp/km2d/BASS_KM2D_S1.zip
      - name: Upload S1 new full-science raw data plus original BASS sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2D_S1_ACTUAL_PHYSICS
          path: /tmp/km2d/BASS_KM2D_S1.zip
          retention-days: 60
          if-no-files-found: error
      - name: Independent algebraic limits, no RHS in Volterra and scoped science tests
        run: |
          python -m pytest -q research/dual_lane_km2d_20261030/tests/test_accelerating_tilt.py
      - name: Preserve S2 science and complete sources
        run: |
          python research/dual_lane_km2d_20261030/package_artifacts.py \
            --stage S2 --results /tmp/km2d/physical_science.json \
            --output /tmp/km2d/BASS_KM2D_S2.zip
      - name: Upload S2 complete physical science archive, final source and tests
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2D_S2_COMPLETE_RESEARCH
          path: |
            /tmp/km2d/BASS_KM2D_S2.zip
            /tmp/km2d/physical_science.json
          retention-days: 60
          if-no-files-found: error
