name: BF3E local lapse source memory
on:
  push:
    branches: [research/bass-bf3e-retarded-lapse-memory-20261028]
    paths:
      - bianchi/nonperturbative/lapse_memory.py
      - tests/nonperturbative/test_lapse_memory.py
      - .github/workflows/bf3e-lapse-memory.yml
permissions:
  contents: read
jobs:
  package-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Test new actual package route
        run: PYTHONPATH=. python -m pytest tests/nonperturbative/test_lapse_memory.py -q --junitxml=/tmp/bf3e-tests.xml
      - name: Installed-wheel independent source equilibrium
        run: |
          python -m pip wheel --no-deps . -w /tmp/bf3e-wheel
          python -m pip install --no-deps --target /tmp/bf3e-install /tmp/bf3e-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/bf3e-install python - <<'PY'
          import numpy as np
          from bianchi.nonperturbative.lapse_field import FieldGrid,PeriodicLapse,stationary
          from bianchi.nonperturbative.lapse_memory import LapseMemory
          g=FieldGrid(7,6,8);op=LapseMemory(g,PeriodicLapse(.55),1.1,backend='python_oracle')
          y=stationary(g);out=op.solve(y,.1,4).at(.1)
          assert np.max(abs(out-y))<4e-10
          print('INSTALLED_WHEEL_SOURCE_MEMORY_PASS; native NOT_RUN')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bf3e-${{ github.sha }}
          path: /tmp/bf3e-tests.xml
          retention-days: 30
