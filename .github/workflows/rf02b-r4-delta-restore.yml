name: RF-02B R4 delta restore

on:
  push:
    branches:
      - "artifact/native-r4-delta-rf02b-20260826-r1"
    paths:
      - ".github/workflows/rf02b-r4-delta-restore.yml"

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.94.1"
  R4_BRANCH: "artifact/native-repro-bundle-20260825-r4"
  R4_HEAD: "b069e46eeb649b7b33e5ca30c3508d144fcd0e2c"
  R4_ARCHIVE_SHA256: "1c587e04e93095d39ec821b2a7cb6824132d9c2ded635ee8c6101410490fabd3"
  SOURCE_COMMIT: "01d1bed4afb75c648c5f13652c7073a014f8f1ac"
  CARGO_LOCK_SHA256: "d500208e9353ade1cb74693918598846628219e6e7bd2e2bce9ec85e29eb6310"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  restore-r4-plus-rf02b-delta:
    name: Reassemble R4, overlay RF-02B, and prove offline closure
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out immutable R4 artifact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.R4_HEAD }}
          path: r4-artifact
      - name: Check out frozen RF-02B source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          path: candidate
      - name: Select CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the pinned Rust compiler before the offline boundary
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --no-self-update
          rustup override set "$RUST_TOOLCHAIN"
      - name: Reassemble R4 and apply the exact RF-02B source delta
        shell: bash
        run: |
          set -euo pipefail
          bundle="$GITHUB_WORKSPACE/r4-artifact/repro/native/BASS-RF01-NATIVE-20260825T035620Z"
          archive="$RUNNER_TEMP/BASS_NATIVE_REPRO_BASS-RF01-NATIVE-20260825T035620Z.tar.xz"
          python "$bundle/reassemble_bundle.py" \
            --manifest "$bundle/BUNDLE_MANIFEST.json" \
            --parts-dir "$bundle/parts" \
            --output "$archive"
          test "$(sha256sum "$archive" | cut -d' ' -f1)" = "$R4_ARCHIVE_SHA256"
          extract="$RUNNER_TEMP/r4-extract"
          mkdir "$extract"
          tar -xJf "$archive" -C "$extract"
          repo_root="$(find "$extract" -type f -path '*/_rustcore/Cargo.toml' -printf '%h\n' | sed 's#/_rustcore$##' | head -n 1)"
          test -n "$repo_root"
          test "$(sha256sum "$repo_root/_rustcore/Cargo.lock" | cut -d' ' -f1)" = "$CARGO_LOCK_SHA256"
          test "$(sha256sum candidate/_rustcore/Cargo.lock | cut -d' ' -f1)" = "$CARGO_LOCK_SHA256"
          for path in \
            _rustcore/src/lib.rs \
            _rustcore/src/ode/charts.rs \
            bianchi/backend.py \
            bianchi/backend_policy.py \
            bianchi/geometry_identity.py \
            bianchi/scalar_charts.py \
            bianchi/symbolic/geometry_contract.py \
            tests/test_rf02b_scalar_ops.py
          do
            install -D "candidate/$path" "$repo_root/$path"
            test "$(sha256sum "candidate/$path" | cut -d' ' -f1)" = \
              "$(sha256sum "$repo_root/$path" | cut -d' ' -f1)"
          done
          wheelhouse="$(find "$extract" -type d -name wheelhouse -print -quit)"
          test -n "$wheelhouse"
          diffsol_dir="$(find "$extract" -type d -name 'diffsol-0.16.1' -print -quit)"
          test -n "$diffsol_dir"
          test -f "$diffsol_dir/.cargo-checksum.json"
          vendor_dir="$(dirname "$diffsol_dir")"
          cargo_home="$RUNNER_TEMP/rf02b-cargo-home"
          mkdir "$cargo_home"
          VENDOR_DIR="$vendor_dir" CONFIG="$cargo_home/config.toml" python - <<'PY'
          import json, os, pathlib
          pathlib.Path(os.environ["CONFIG"]).write_text(
              '[source.crates-io]\n'
              'replace-with = "r4-vendored-sources"\n\n'
              '[source.r4-vendored-sources]\n'
              f'directory = {json.dumps(os.environ["VENDOR_DIR"])}\n\n'
              '[net]\n'
              'offline = true\n',
              encoding="utf-8",
          )
          PY
          printf '%s\n' \
            "RF02B_REPO_ROOT=$repo_root" \
            "RF02B_WHEELHOUSE=$wheelhouse" \
            "RF02B_CARGO_HOME=$cargo_home" >> "$GITHUB_ENV"
      - name: Build and test only the RF-02B delta with R4 inputs offline
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
          PIP_NO_INDEX: "1"
          BASS_ALLOW_UNVERIFIED_NATIVE_DEV: "1"
        run: |
          set -euo pipefail
          export CARGO_HOME="$RF02B_CARGO_HOME"
          python -m venv "$RUNNER_TEMP/rf02b-venv"
          py="$RUNNER_TEMP/rf02b-venv/bin/python"
          "$py" -m pip install --no-index --find-links "$RF02B_WHEELHOUSE" \
            --requirement candidate/requirements.lock "maturin==1.14.1"
          mkdir "$RUNNER_TEMP/rf02b-wheel"
          (
            cd "$RF02B_REPO_ROOT/_rustcore"
            cargo test --lib --locked --offline rf02b_
            "$py" -m maturin build --release --locked --offline \
              --out "$RUNNER_TEMP/rf02b-wheel"
          ) | tee "$RUNNER_TEMP/rf02b-cargo.log"
          "$py" -m pip install --no-index --no-deps "$RUNNER_TEMP"/rf02b-wheel/bianchi_rustcore-*.whl
          (
            cd "$RF02B_REPO_ROOT"
            PYTHONPATH=. "$py" -m pytest -q tests/test_rf02b_scalar_ops.py
          ) | tee "$RUNNER_TEMP/rf02b-python.log"
      - name: Emit content-addressed restore receipt
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find "$RUNNER_TEMP/rf02b-wheel" -name 'bianchi_rustcore-*.whl' -print -quit)"
          test -n "$wheel"
          WHEEL="$wheel" RECEIPT="$RUNNER_TEMP/RF02B_R4_DELTA_RESTORE.json" python - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          wheel = pathlib.Path(os.environ["WHEEL"])
          def sha(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          with zipfile.ZipFile(wheel) as archive:
              so_name = next(name for name in archive.namelist() if name.endswith(".so"))
              so_sha = hashlib.sha256(archive.read(so_name)).hexdigest()
          receipt = {
              "schema": "bass-rf02b-r4-delta-restore-v1",
              "status": "PASS_R4_PLUS_RF02B_DELTA_OFFLINE",
              "r4": {
                  "branch": os.environ["R4_BRANCH"],
                  "head": os.environ["R4_HEAD"],
                  "archive_sha256": os.environ["R4_ARCHIVE_SHA256"],
              },
              "source_commit": os.environ["SOURCE_COMMIT"],
              "cargo_lock_sha256": os.environ["CARGO_LOCK_SHA256"],
              "wheel": {"filename": wheel.name, "sha256": sha(wheel)},
              "shared_object": {"path": so_name, "sha256": so_sha},
              "focused_proof": {
                  "cargo": "rf02b_ selectors PASS",
                  "python": "tests/test_rf02b_scalar_ops.py PASS",
              },
              "performance": "NOT_RUN",
              "formula_authority": "UNCHANGED_UNPROMOTED",
          }
          pathlib.Path(os.environ["RECEIPT"]).write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="utf-8"
          )
          PY
          sha256sum "$RUNNER_TEMP/RF02B_R4_DELTA_RESTORE.json"
      - name: Preserve the verified R4 delta payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rf02b-r4-delta-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/rf02b-wheel/bianchi_rustcore-*.whl
            ${{ runner.temp }}/RF02B_R4_DELTA_RESTORE.json
            ${{ runner.temp }}/rf02b-cargo.log
            ${{ runner.temp }}/rf02b-python.log
          if-no-files-found: error
          retention-days: 7
