name: CE1-AE original six-cell continuous-time l4 physical spectrum
on:
  push:
    branches: ['research/bass-ce1ae-original-continuous-time-l4-spectrum-20261030-r1']
  pull_request:
    paths:
      - 'research/ce1ae_20261030/**'
      - '.github/workflows/ce1ae-physical-integral-spectrum.yml'
jobs:
  science:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned numerical math
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2 matplotlib==3.10.7
      - name: Check actual original source SHA and strict parent witness
        run: python research/ce1ae_20261030/source/spectral_gap_certificate.py
      - name: Recompute real six-cell coupled Einstein-Vlasov 6/8/16/64 histories and integral spectrum
        run: python research/ce1ae_20261030/source/continuous_kernel_physics.py
      - name: Verify exact dyadic quadrature surrogate positivity without physical claim confusion
        run: python research/ce1ae_20261030/source/certify_dyadic_integral_surrogate.py
      - name: Run scoped physical, covariance, source lock and adversarial tests
        run: python -m pytest -q research/ce1ae_20261030/source/test_ce1ae.py
      - name: Compile code
        run: python -m compileall -q research/ce1ae_20261030/source
      - name: Render scientific original physical plots
        run: python research/ce1ae_20261030/source/plot_physics.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AE_ORIGINAL_SIX_CELL_CONTINUOUS_TIME_SPECTRUM
          path: |
            research/ce1ae_20261030/data/
            research/ce1ae_20261030/figures/
            research/ce1ae_20261030/THEORY_KO.md
            research/ce1ae_20261030/REPORT_KO.md
          if-no-files-found: error
