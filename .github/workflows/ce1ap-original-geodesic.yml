name: CE1AP original sixcell geodesic redshift physical science
on:
  push:
    branches:
      - research/bass-ce1ap-original-geodesic-redshift-20261031-r1
  pull_request:
    paths:
      - 'research/ce1ap_20261031/**'
      - '.github/workflows/ce1ap-original-geodesic.yml'
permissions:
  contents: read
jobs:
  physical_source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install source-matched numerical runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Compute nine original Einstein Vlasov IVPs and directional null rays
        run: python research/ce1ap_20261031/source/ce1ap_remote.py
      - name: Independently test original parent endpoint and physics
        run: python -m pytest -q research/ce1ap_20261031/source/test_ce1ap_remote.py
      - name: Compile source to bytecode
        run: python -m compileall -q research/ce1ap_20261031/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AP-original-sixcell-20451-geodesic-physical-rows
          path: |
            research/ce1ap_20261031/data/
            research/ce1ap_20261031/source/
            research/ce1ap_20261031/reports/
            research/ce1ap_20261031/ancestor/CE1AP_PARENT_GL24_ENDPOINTS.json
          if-no-files-found: error
