name: KM-2G neutral electron proton Einstein Bianchi I polarized photon science
on:
  push:
    branches: [research/bass-km2g-neutral-electron-proton-einstein-20261030-r1]
  pull_request:
    branches: [research/bass-km2f-einstein-momentum-constraints-20261030-r1]
permissions:
  contents: read
jobs:
  neutral-baryon-physics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      BASS_KM2G_RESULT: /tmp/km2g/neutral_science.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Pin parent KM2F and original BASS ray and Thomson source Git blobs
        run: |
          set -euo pipefail
          test "$(git hash-object research/dual_lane_km2f_20261030/einstein_bianchi.py)" = 457790df7aba6d82326ac6f3be5814851b970b1d
          test "$(git hash-object research/dual_lane_km2c_20261028/code/curved_tilt.py)" = 05aade3aab7e9a32c11608882c943e4d3cb6f379
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/tilted_collision.py)" = 92660768f4719d78261fed1cb44f186d2821629d
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/source_memory.py)" = 9d500e36fefaa4ddc22300a2f03d9eb9cfe98403
          test "$(git hash-object research/dual_lane_km2d_20261030/accelerating_tilt.py)" = b599d3842e843d8de1de1499b73e6849374bf8f8
          test "$(git hash-object research/dual_lane_km2e_20261030/coupled_electron_photon.py)" = 12fbce8109fc07b1fbf60d9a066d8aa1c57ea9c1
          git rev-parse HEAD
      - name: Pin numeric Python dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          python -m compileall -q research/dual_lane_km2g_20261030
      - name: Preserve S0 original frozen theory and actual source before computation
        run: |
          mkdir -p /tmp/km2g
          python -m research.dual_lane_km2g_20261030.package_artifacts --stage S0 --output /tmp/km2g/BASS_KM2G_S0.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2G_S0_ORIGINAL_THEORY
          path: /tmp/km2g/BASS_KM2G_S0.zip
          retention-days: 60
          if-no-files-found: error
      - name: Actually evolve six fully polarized Einstein and neutral e-p physical histories
        run: |
          python -m research.dual_lane_km2g_20261030.neutral_baryons --output /tmp/km2g/neutral_science.json
      - name: Preserve S1 actual six physical cases plus complete original code
        run: |
          python -m research.dual_lane_km2g_20261030.package_artifacts --stage S1 --results /tmp/km2g/neutral_science.json --output /tmp/km2g/BASS_KM2G_S1.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2G_S1_REAL_ELECTRON_ION_PHYSICS
          path: /tmp/km2g/BASS_KM2G_S1.zip
          retention-days: 60
          if-no-files-found: error
      - name: Hostile scientific regression and mass dimension tests against actual physical science
        run: python -m pytest -q research/dual_lane_km2g_20261030/tests/test_neutral_baryons.py
      - name: Preserve complete S2 report data source and tests
        run: |
          python -m research.dual_lane_km2g_20261030.package_artifacts --stage S2 --results /tmp/km2g/neutral_science.json --output /tmp/km2g/BASS_KM2G_S2.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2G_S2_FULL_SCIENCE
          path: |
            /tmp/km2g/BASS_KM2G_S2.zip
            /tmp/km2g/neutral_science.json
          retention-days: 60
          if-no-files-found: error
