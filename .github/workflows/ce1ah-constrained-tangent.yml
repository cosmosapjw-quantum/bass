name: CE1AH original constrained Einstein-Vlasov l2-l4 tangent physics
on:
  push:
    branches:
      - research/bass-ce1ah-coupled-constrained-initial-shear-tangent-20261031-r1
  pull_request:
    paths:
      - 'research/ce1ah_20261031/**'
      - '.github/workflows/ce1ah-constrained-tangent.yml'

jobs:
  physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install matched scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Generate original source-locked constrained Einstein-Vlasov physical response
        run: python research/ce1ah_20261031/source/ce1ah_tangent.py --orders 6,8,16 --epochs 401
      - name: Test 19 new physical/tangent/perturbed and adversarial checks
        run: python -m pytest -q research/ce1ah_20261031/source/test_ce1ah.py
      - name: Test 24 unchanged source-parent physics controls
        run: python -m pytest -q research/ce1af_20261030/source/test_ce1af.py
      - name: Generate scientific figures
        run: python research/ce1ah_20261031/source/plot_ce1ah.py
      - name: Compile all new source code
        run: python -m compileall -q research/ce1ah_20261031/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AH-ORIGINAL-COUPLED-SHEAR-MULTIPOLE-PHYSICS
          path: |
            research/ce1ah_20261031/data/
            research/ce1ah_20261031/figures/
            research/ce1ah_20261031/THEORY_KO.md
            research/ce1ah_20261031/REPORT_KO.md
          if-no-files-found: error
