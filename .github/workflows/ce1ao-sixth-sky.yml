name: CE1AO original-sixcell l6 sky source transfer
on:
  push:
    branches: [research/bass-ce1ao-sixth-sky-transfer-20261031-r1]
  pull_request:
    paths:
      - 'research/ce1ao_20261031/**'
      - '.github/workflows/ce1ao-sixth-sky.yml'
jobs:
  original_source_sky:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install source-matched runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8 sympy==1.14.0
      - name: Recompute inherited CE1AN original Einstein-Vlasov 24 IVPs
        run: python research/ce1an_20261031/source/ce1an_remote.py
      - name: Generate new 8421 original source-owned l2 l4 l6 l8 sky rows
        run: python research/ce1ao_20261031/source/ce1ao_remote.py
      - name: Test sourced harmonics and physical moment gates
        run: python -m pytest -q research/ce1ao_20261031/source/test_ce1ao_remote.py
      - name: Compile scientific source
        run: python -m compileall -q research/ce1ao_20261031/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AO-source-owned-8421-original-l6-sky
          path: |
            research/ce1ao_20261031/data/
            research/ce1ao_20261031/source/
            research/ce1ao_20261031/reports/
          if-no-files-found: error
