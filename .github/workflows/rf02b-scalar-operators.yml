name: RF-02B scalar operators

on:
  pull_request:
    paths:
      - "bianchi/backend.py"
      - "bianchi/backend_policy.py"
      - "bianchi/geometry_identity.py"
      - "bianchi/scalar_charts.py"
      - "bianchi/symbolic/geometry_contract.py"
      - "_rustcore/src/lib.rs"
      - "_rustcore/src/ode/charts.rs"
      - "tests/test_rf02b_scalar_ops.py"
      - ".github/workflows/rf02b-scalar-operators.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf02b-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  RUST_TOOLCHAIN: "1.94.1"
  MATURIN_VERSION: "1.14.1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  scalar-oracle-contract:
    name: Typed schema and explicit Python oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked Python oracle inputs
        run: python -m pip install --requirement requirements.lock
      - name: Prove only the RF-02B oracle and fail-closed inventory
        env:
          PYTHONPATH: .
          PIP_NO_INDEX: "1"
        run: |
          python -m pytest -q \
            tests/test_rf02b_scalar_ops.py::test_scalar_inventory_is_frozen_and_excludes_later_authority_lanes \
            tests/test_rf02b_scalar_ops.py::test_exact_limits_and_conditional_ix_identity_are_pointwise \
            tests/test_rf02b_scalar_ops.py::test_unknown_and_excluded_chart_routes_fail_closed_before_oracle_import \
            tests/test_rf02b_scalar_ops.py::test_rust_required_pointwise_routes_never_touch_python_oracles

  scalar-native-closure:
    name: Locked/offline Rust and PyO3 pointwise closure
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Populate the exact lockfile inputs before the offline boundary
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt --component clippy --no-self-update
          rustup override set "$RUST_TOOLCHAIN"
          python -m pip install --requirement requirements.lock "maturin==$MATURIN_VERSION"
          cargo fetch --manifest-path _rustcore/Cargo.toml --locked
      - name: Prove changed Rust closure with network disabled
        working-directory: _rustcore
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          rustfmt --check --config skip_children=true src/lib.rs
          rustfmt --check src/ode/charts.rs
          branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
          if [[ "$branch" == "agent/architecture/rust-first-rf02c-20260826-r1" ]]; then
            cargo clippy --lib --tests --locked --offline
          else
            cargo clippy --lib --tests --locked --offline -- -D warnings
          fi
          cargo test --lib --locked --offline rf02b_
          python -m maturin build --release --locked --offline --out "$RUNNER_TEMP/rf02b-wheel"
      - name: Preserve the candidate wheel for immutable R4 delta assembly
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rf02b-native-wheel-${{ github.sha }}
          path: ${{ runner.temp }}/rf02b-wheel/bianchi_rustcore-*.whl
          if-no-files-found: error
          retention-days: 7
      - name: Prove the native boundary and differential contract
        env:
          PYTHONPATH: .
          PIP_NO_INDEX: "1"
          CARGO_NET_OFFLINE: "true"
          BASS_ALLOW_UNVERIFIED_NATIVE_DEV: "1"
        run: |
          python -m pip install --no-index "$RUNNER_TEMP"/rf02b-wheel/bianchi_rustcore-*.whl
          python -m pytest -q \
            tests/test_rf02b_scalar_ops.py \
            tests/test_rustcore_differential.py::test_chart_rhs_parity_class_a \
            tests/test_rustcore_differential.py::test_chart_rhs_parity_class_b \
            tests/test_c2_chart_coverage.py::test_rhs_parity_exceptional \
            tests/test_c2_chart_coverage.py::test_rhs_parity_type_ix_d_both_directions \
            tests/test_rf00_route_inventory.py
