name: BASS REI IGM original KM2 electron-to-visibility physics
on:
  push:
    branches: [research/bass-km2-rei-igm-electron-visibility-response-20261101]
  pull_request:
    paths: ["research/bass_rei_igm_electron_response_20261101/**", ".github/workflows/bass-rei-igm-km2-electron-visibility.yml"]
permissions:
  contents: read
  actions: read
jobs:
  original-source-physics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      BASS_ORIGINAL_S2: /tmp/KM2N_original_source_s2.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - name: Install original numeric environment
        run: python -m pip install numpy==2.3.5
      - name: Restore exact original BASS KM2N source without new Einstein IVPs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/cosmosapjw-quantum/bass/actions/artifacts/13035232055/zip' \
            --output "$BASS_ORIGINAL_S2"
          echo '45733f4ca2c0250cc94d934e0c58c7dbb0f6220350b2a303e25e55f77c787ffe  /tmp/KM2N_original_source_s2.zip' | sha256sum -c -
      - name: Generate real BASS KM2N electron opacity response for 800 original rays
        run: |
          python research/bass_rei_igm_electron_response_20261101/response_kernel.py \
            --source "$BASS_ORIGINAL_S2" --output physical_outputs
      - name: Scientific tests standard and optimized, all with exact original S2 source
        run: |
          python -m unittest discover -s research/bass_rei_igm_electron_response_20261101 -p test_response.py -v
          python -O -m unittest discover -s research/bass_rei_igm_electron_response_20261101 -p test_response.py -q
          python -m compileall -q research/bass_rei_igm_electron_response_20261101
      - name: Verify original scientific rows and no false REI DAG admission
        run: |
          python - <<'PY'
          import pathlib,hashlib,json,csv,gzip
          root=pathlib.Path('physical_outputs')
          o=json.loads((root/'BASS_REI_CAUSAL_ELECTRON_RESPONSE.json').read_text())
          assert o['new_model_response_rows']==32000 and o['original_ray_visibility_nodes']==256000
          assert o['BASS_upper_DAG']=='9/15_SCOPED' and o['REI_central_DAG']=='28/88_REPORTED'
          assert o['canonical_delta']==0 and not o['source_matched_with_REI_F05']
          for g,n in [(12,288),(16,512)]:
            x=o['grids'][str(g)]
            assert x['rays']==n
            assert x['max_tau_original_gauss_error']<2e-12
            assert x['max_panel_actual_source_fd_error']<4e-9
            for name,digest in x['published_files'].items():
              p=root/name
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest
              with gzip.open(p,'rt') as f: rows=list(csv.DictReader(f))
              assert len(rows)==(40*n if 'PANEL_RESPONSE' in name else 320*n), (name,len(rows))
          print('BASS_REI_IGM_PHYSICAL_DATA_ACCEPTED_SCOPED:32000+256000, central_delta=0')
          PY
      - name: Preserve complete physical data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_REI_IGM_ORIGINAL_ELECTRON_HISTORY_RESPONSE
          path: physical_outputs/
          if-no-files-found: warn
