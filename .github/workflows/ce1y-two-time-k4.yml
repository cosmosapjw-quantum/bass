name: CE1-Y physical RK4 vs DOP853 two-epoch K4 atlas
on:
  push:
    branches: [research/bass-ce1y-rk4-vs-dop-k4-20261030-r1]
  pull_request:
    branches: [research/bass-ce1x-rust-l4-crosskernel-certificate-20261030-r1]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frozen-physics-atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Assert actual original BASS source Git blob
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84
      - name: Install scoped physical data dependencies
        run: python -m pip install numpy==2.3.5 pytest==9.0.2 matplotlib==3.10.7
      - name: Regenerate all 10086 physical two-epoch K4 records from pinned original Rust outputs
        run: |
          python research/ce1y_20261030/source/generate_rk4_k4_transfer.py --inputs research/ce1y_20261030/input --output /tmp/ce1y_regenerated
      - name: Verify original physical input and published numeric output parity
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          a=Path('/tmp/ce1y_regenerated');b=Path('research/ce1y_20261030/data')
          for n in (6,8):
              for s in (4,8,16):
                  f=f'GL{n}_STEPS{s}_two_time_K4_1681.csv'
                  with (a/f).open() as h: aa=list(csv.DictReader(h))
                  with (b/f).open() as h: bb=list(csv.DictReader(h))
                  assert len(aa)==len(bb)==1681
                  for q,r in zip(aa,bb):
                      for k in ('u','v','K4_delta_RK4_BASS_Rust','K4_delta_DOP853_reference','empirical_difference'):
                          assert abs(float(q[k])-float(r[k]))<2e-12,(f,k)
          print('CE1Y_FINAL_SOURCE_LOCKED_GITHUB_PHYSICS_DATA_10086_PASS')
          PY
      - name: Scientific model tests and compileall
        run: |
          python -m pytest -q research/ce1y_20261030/tests/test_ce1y_physical.py
          python -m compileall -q research/ce1y_20261030/source research/ce1y_20261030/tests
      - name: Upload scientific regenerated output and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: CE1Y_REAL_BASS_10086_PHYSICAL_K4
          path: /tmp/ce1y_regenerated
