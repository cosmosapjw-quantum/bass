name: BASS original TypeII old versus Kato moving-AEM2 science, not production
on:
  pull_request:
    paths:
      - 'research/typeii_aem2_compare_20261101/**'
      - '.github/workflows/typeii-moving-aem2.yml'
permissions:
  contents: read
jobs:
  original_typeii_comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install exact reference math runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Read pinned original five Git blobs and compute all 96 physically scoped comparisons
        run: |
          python research/typeii_aem2_compare_20261101/source/replay_from_original_fixture.py
      - name: Test TypeII source fixture, independent angular structure and stiff Kato superiority
        run: |
          python -m pytest -q research/typeii_aem2_compare_20261101/source/test_replay.py
      - name: Independent saved-source referee normal and python optimized
        run: |
          python research/typeii_aem2_compare_20261101/source/referee_saved.py
          python -O research/typeii_aem2_compare_20261101/source/referee_saved.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS-ORIGINAL-TYPEII-OLD-VS-KATO-AEM2-96-SOURCE-VERIFIED
          path: |
            research/typeii_aem2_compare_20261101/source/*.py
            research/typeii_aem2_compare_20261101/ci_generated/*.csv
            research/typeii_aem2_compare_20261101/ci_generated/*.json
            research/typeii_aem2_compare_20261101/*.json
            research/typeii_aem2_compare_20261101/*.md
          if-no-files-found: error
