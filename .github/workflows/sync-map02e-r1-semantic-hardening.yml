name: sync-map02e-r1-semantic-hardening

on:
  pull_request:
    paths:
      - ".github/workflows/sync-map02e-r1-semantic-hardening.yml"
      - "docs/bass_master_ssot_v2/SYNC_MAP_02E_R1/**"
      - "scripts/build_sync_map02e_r1_hardening.py"
      - "scripts/verify_sync_map02e_r1_hardening.py"
      - "scripts/run_sync_map02e_r1_local_validation.sh"
      - "tests/test_sync_map02e_r1_semantic_hardening.py"
      - "wolfram/BASS/Kernel/IR/SharedFramePhotonExportHardeningR1.wl"
      - "wolfram/BASS/Kernel/IR/SharedFramePhotonExportHardeningR1Fix1.wl"
      - "wolfram/BASS/Tests/SYNCMAP02ER1SharedFramePhotonHardening.wlt"
      - "wolfram/scripts/run_sync_map02e_r1_local_replay.wls"
  push:
    branches:
      - "research/bass-master-ssot-v2-sync-map02e-r1-semantic-hardening-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run standard-library mutation-sensitive tests
        run: python -m unittest -v tests/test_sync_map02e_r1_semantic_hardening.py
      - name: Compile Python surfaces
        run: |
          python -m py_compile \
            scripts/build_sync_map02e_r1_hardening.py \
            scripts/verify_sync_map02e_r1_hardening.py \
            tests/test_sync_map02e_r1_semantic_hardening.py
      - name: Generate and verify hardened full registry
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sync-map02e-r1-generated"
          mkdir -p "$out"
          python scripts/build_sync_map02e_r1_hardening.py \
            --input docs/bass_master_ssot_v2/SYNC_MAP_02E/BASS_SHARED_FRAME_PHOTON_EXPORT.json \
            --output "$out/BASS_SHARED_FRAME_PHOTON_EXPORT_R1.json" \
            --receipt "$out/SYNC_MAP_02E_R1_LOCAL_BUILD_RECEIPT.json"
          python scripts/verify_sync_map02e_r1_hardening.py \
            --input "$out/BASS_SHARED_FRAME_PHOTON_EXPORT_R1.json" \
            --receipt "$out/SYNC_MAP_02E_R1_LOCAL_BUILD_RECEIPT.json"
          python -m json.tool "$out/BASS_SHARED_FRAME_PHOTON_EXPORT_R1.json" >/dev/null
          python -m json.tool "$out/SYNC_MAP_02E_R1_LOCAL_BUILD_RECEIPT.json" >/dev/null
      - name: Check Wolfram top-level test discovery surface
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -c '^VerificationTest\[' wolfram/BASS/Tests/SYNCMAP02ER1SharedFramePhotonHardening.wlt)"
          test "$count" -eq 11
          grep -F 'SharedFramePhotonExportHardeningR1.wl' \
            wolfram/BASS/Tests/SYNCMAP02ER1SharedFramePhotonHardening.wlt
          grep -F 'SharedFramePhotonExportHardeningR1Fix1.wl' \
            wolfram/BASS/Tests/SYNCMAP02ER1SharedFramePhotonHardening.wlt
      - name: Exact-parent text hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=e1467825c8f4c5e3f47df5da5b8a6202e8f96f30
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE"...HEAD
      - name: Build BASS-only local-replay source packet
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/sync-map02e-r1-source-packet"
          generated="$RUNNER_TEMP/sync-map02e-r1-generated"
          mkdir -p "$packet/generated"
          paths=(
            docs/bass_master_ssot_v2/SYNC_MAP_02E/BASS_SHARED_FRAME_PHOTON_EXPORT.json
            docs/bass_master_ssot_v2/SYNC_MAP_02E_R1/SEMANTIC_HARDENING_PATCH_CONTRACT.json
            docs/bass_master_ssot_v2/SYNC_MAP_02E_R1/LOCAL_REPLAY_README.md
            scripts/build_sync_map02e_r1_hardening.py
            scripts/verify_sync_map02e_r1_hardening.py
            scripts/run_sync_map02e_r1_local_validation.sh
            tests/test_sync_map02e_r1_semantic_hardening.py
            wolfram/BASS/Kernel/IR/SharedFramePhotonExportHardeningR1.wl
            wolfram/BASS/Kernel/IR/SharedFramePhotonExportHardeningR1Fix1.wl
            wolfram/BASS/Tests/SYNCMAP02ER1SharedFramePhotonHardening.wlt
            wolfram/scripts/run_sync_map02e_r1_local_replay.wls
          )
          for path in "${paths[@]}"; do
            mkdir -p "$packet/$(dirname "$path")"
            cp "$path" "$packet/$path"
          done
          cp "$generated/BASS_SHARED_FRAME_PHOTON_EXPORT_R1.json" "$packet/generated/"
          cp "$generated/SYNC_MAP_02E_R1_LOCAL_BUILD_RECEIPT.json" "$packet/generated/"
          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git show -s --format=%T HEAD)"
            printf 'repository_scope=BASS_ONLY\n'
            for path in "${paths[@]}"; do
              printf '%s  %s\n' "$(git rev-parse "HEAD:$path")" "$path"
            done
          } > "$packet/GIT_OBJECT_MANIFEST.txt"
          (cd "$packet" && \
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) \
            > "$packet/SHA256SUMS"
      - name: Upload BASS-only local-replay source packet
        uses: actions/upload-artifact@v4
        with:
          name: sync-map02e-r1-bass-only-local-replay
          path: ${{ runner.temp }}/sync-map02e-r1-source-packet
          if-no-files-found: error
          retention-days: 30
