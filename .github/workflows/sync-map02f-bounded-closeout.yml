name: sync-map02f-bounded-closeout

on:
  pull_request:
    paths:
      - ".github/workflows/sync-map02f-bounded-closeout.yml"
      - "docs/bass_master_ssot_v2/SYNC_MAP_02F_CLOSEOUT/**"
      - "scripts/verify_sync_map02f_bounded_closeout.py"
      - "scripts/run_sync_map02f_bounded_closeout_local.sh"
      - "tests/test_sync_map02f_bounded_closeout.py"
      - "wolfram/BASS/Kernel/IR/BoundedSemanticCloseout.wl"
      - "wolfram/BASS/Tests/BoundedSemanticCloseout.wlt"
      - "wolfram/scripts/run_bounded_semantic_closeout.wls"
  push:
    branches:
      - "research/bass-master-ssot-v2-sync-map02f-bounded-closeout-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract-and-source-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify bounded closeout graph
        run: >-
          python scripts/verify_sync_map02f_bounded_closeout.py
          --graph docs/bass_master_ssot_v2/SYNC_MAP_02F_CLOSEOUT/BOUNDED_SEMANTIC_CLOSEOUT.json
      - name: Run mutation-sensitive tests
        run: python -m unittest -v tests/test_sync_map02f_bounded_closeout.py
      - name: Compile Python surfaces
        run: |
          python -m py_compile \
            scripts/verify_sync_map02f_bounded_closeout.py \
            tests/test_sync_map02f_bounded_closeout.py
      - name: Check exact top-level MUnit surface
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -c '^VerificationTest\[' wolfram/BASS/Tests/BoundedSemanticCloseout.wlt)"
          test "$count" -eq 17
          ! grep -F '$InputFileName' wolfram/BASS/Tests/BoundedSemanticCloseout.wlt
          ! grep -F 'Get[' wolfram/BASS/Tests/BoundedSemanticCloseout.wlt
          ! grep -F 'Import[' wolfram/BASS/Tests/BoundedSemanticCloseout.wlt
      - name: Check exact normal ancestry and text hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=e0e4d703bb160128135a97cc384f8533fced743b
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE"...HEAD
      - name: Build BASS-only source packet
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/sync-map02f-bounded-closeout"
          mkdir -p "$packet"
          paths=(
            docs/bass_master_ssot_v2/SYNC_MAP_02F_CLOSEOUT/BOUNDED_SEMANTIC_CLOSEOUT.json
            docs/bass_master_ssot_v2/SYNC_MAP_02F_CLOSEOUT/README.md
            scripts/verify_sync_map02f_bounded_closeout.py
            scripts/run_sync_map02f_bounded_closeout_local.sh
            tests/test_sync_map02f_bounded_closeout.py
            wolfram/BASS/Kernel/IR/BoundedSemanticCloseout.wl
            wolfram/BASS/Tests/BoundedSemanticCloseout.wlt
            wolfram/scripts/run_bounded_semantic_closeout.wls
          )
          for path in "${paths[@]}"; do
            mkdir -p "$packet/$(dirname "$path")"
            cp "$path" "$packet/$path"
          done
          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git show -s --format=%T HEAD)"
            printf 'repository_scope=BASS_ONLY\n'
            for path in "${paths[@]}"; do
              printf '%s  %s\n' "$(git rev-parse "HEAD:$path")" "$path"
            done
          } > "$packet/GIT_OBJECT_MANIFEST.txt"
          (cd "$packet" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) \
            > "$packet/SHA256SUMS"
      - name: Upload BASS-only source packet
        uses: actions/upload-artifact@v4
        with:
          name: sync-map02f-bounded-closeout-bass-only
          path: ${{ runner.temp }}/sync-map02f-bounded-closeout
          if-no-files-found: error
          retention-days: 30
