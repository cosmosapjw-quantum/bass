name: BASS Type-II original scalar uniformization and StageII fail-closed source check
on:
  push:
    branches:
      - research/bass-stageii-typeii-uniformization-20261101-r1
  pull_request:
    paths:
      - 'research/typeii_stageii_preflight_20261101/**'
      - '.github/workflows/typeii-stageii-preflight.yml'
permissions:
  contents: read
jobs:
  source_owned_scalar_uniformization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Pin exact source-arithmetic runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Verify original BASS source Git blobs
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          a=json.loads(pathlib.Path('research/typeii_stageii_preflight_20261101/SOURCE_BINDINGS.json').read_text())
          for path,expected in a['source_blobs'].items():
              b=pathlib.Path(path).read_bytes()
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\x00'+b).hexdigest()
              if sha!=expected:raise RuntimeError(('SOURCE_DRIFT',path,sha,expected))
          print('IMMUTABLE_BASS_SOURCE_GIT_BLOBS',len(a['source_blobs']),'PASS')
          PY
      - name: Recompute original finite-tilt Type-II scalar collision operator
        run: |
          python research/typeii_stageii_preflight_20261101/source/frozen_uniformization.py --out research/typeii_stageii_preflight_20261101/REPLAY_SCIENCE.json
      - name: Source physics tests and independent -O-safe referee
        run: |
          python -m pytest -q research/typeii_stageii_preflight_20261101/source/test_frozen_uniformization.py
          python research/typeii_stageii_preflight_20261101/source/independent_referee.py research/typeii_stageii_preflight_20261101/REPLAY_SCIENCE.json
          python -O research/typeii_stageii_preflight_20261101/source/independent_referee.py research/typeii_stageii_preflight_20261101/REPLAY_SCIENCE.json
          python -m compileall -q research/typeii_stageii_preflight_20261101/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS-TYPEII-SCALAR-FROZEN-UNIFORMIZATION-ORIGINAL-SOURCE
          path: |
            research/typeii_stageii_preflight_20261101/*.json
            research/typeii_stageii_preflight_20261101/*.md
            research/typeii_stageii_preflight_20261101/source/*.py
          if-no-files-found: error
