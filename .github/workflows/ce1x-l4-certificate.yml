name: CE1-X exact l4 sky source + fresh MPFR geometry + original BASS Rust
on:
  push:
    branches: [research/bass-ce1x-rust-l4-crosskernel-certificate-20261030-r1]
  pull_request:
    branches: [research/bass-ce1w-rk4-time-panels-rust-mpfr-20261030-r1]
permissions:
  contents: read
concurrency:
  group: ce1x-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certified-two-time-l4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      CE1X_RESULT: /tmp/ce1x/l4_source_and_transfer.json
      CE1X_RUST_RESULT: /tmp/ce1x/rust_l4.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Pin original physical source and actual BASS Rust kinetic module
        run: |
          set -euo pipefail
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = 'a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84'
          test "$(git hash-object bianchi/nonperturbative/einstein_tabulated_source.py)" = 'fdeb83a65cd424786ba6bb8ddadbcb2b2e2d45bf'
          test "$(git hash-object bianchi/nonperturbative/einstein_interval.py)" = 'abbab0990fdefaf535ccbf5191ae3e060cb19214'
          test "$(git hash-object research/ce1v_20261030/donor/ce1u_cert_source.py)" = '0e8ef8375cf5f26a9a020d6ec878e4b77b5d0560'
          test "$(git hash-object research/ce1v_20261030/donor/GL6_source_exact_bound.json)" = '4a3442e72ccf41563464092079acf84483da9a0f'
          test "$(git hash-object research/ce1v_20261030/donor/GL8_source_exact_bound.json)" = '7cc1f9331aa532d86a71f249a9be552367c90860'
          git rev-parse HEAD
      - name: Frozen scientific runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: Compile all CE1-X Python before scientific compute
        run: python -m compileall -q research/ce1x_20261030
      - name: Create immutable S0 physical mathematics checkpoint
        run: |
          mkdir -p /tmp/ce1x
          python research/ce1x_20261030/stage_archive.py --stage S0 --output /tmp/ce1x
      - name: Upload S0 complete hypothesis and original code
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1X_S0_EXACT_L4_THEORY
          path: /tmp/ce1x/BASS_CE1X_S0.zip
          retention-days: 60
      - name: Regenerate actual all six original MPFR192 RK4 path/time enclosures
        run: |
          set -euo pipefail
          python research/ce1w_20261030/time_panels.py \
            --output /tmp/ce1x/real_time_mpfr.json --steps 4,8,16 --subcells 1
      - name: Certify exact rational reflection-even l4 source and full two-time K4 envelope
        run: |
          set -euo pipefail
          python research/ce1x_20261030/certify_l4.py \
            --time-certificate /tmp/ce1x/real_time_mpfr.json \
            --output /tmp/ce1x/l4_source_and_transfer.json
      - name: Build original BASS Rust and independently compute l4 K4 on all six matched paths
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustc +1.94.1 --edition=2021 -C opt-level=2 -A dead_code \
            research/ce1r_20261030/sky_time_derivative.rs -o /tmp/ce1x_bass_rust
          /tmp/ce1x_bass_rust --selftest
          python research/ce1x_20261030/rust_l4_parity.py \
            --binary /tmp/ce1x_bass_rust \
            --time-certificate /tmp/ce1x/real_time_mpfr.json \
            --source-certificate /tmp/ce1x/l4_source_and_transfer.json \
            --raw-dir /tmp/ce1x/rust_raw \
            --output /tmp/ce1x/rust_l4.json
      - name: Run source / geometry / l4 counterexample and native Rust data-backed tests
        run: |
          set -euo pipefail
          python -m pytest -q research/ce1x_20261030/tests/test_l4.py
      - name: Preserve S1 executable sources and native Rust raw sky measurements
        run: python research/ce1x_20261030/stage_archive.py --stage S1 --output /tmp/ce1x
      - name: Upload S1 full source and actual MPFR / native Rust evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1X_S1_EXACT_RATIONAL_MPFR_BASS_RUST
          path: /tmp/ce1x/BASS_CE1X_S1.zip
          retention-days: 60
      - name: Generate scoped S2 Korean results and copyable thread handoff
        run: python research/ce1x_20261030/stage_archive.py --stage S2 --output /tmp/ce1x
      - name: Upload S2 final complete manifest-verified recovery package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1X_S2_L4_CROSS_KERNEL_REPORT_AND_HANDOFF
          path: /tmp/ce1x/BASS_CE1X_S2.zip
          retention-days: 60
