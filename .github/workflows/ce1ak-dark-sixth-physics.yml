name: CE1AK original sixth dark-source delayed Einstein response
on:
  push:
    branches: [research/bass-ce1ak-dark-sixth-stress-delayed-gravity-20261031-r1]
  pull_request:
    paths:
      - 'research/ce1ak_20261031/**'
      - '.github/workflows/ce1ak-dark-sixth-physics.yml'
jobs:
  original_physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install original scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Regenerate actual sixth-moment source and Einstein response physical data
        run: python research/ce1ak_20261031/source/ce1ak_reproduce.py
      - name: Regenerate unchanged CE1AJ parent physical dependencies
        run: python research/ce1aj_20261031/source/ce1aj_physics.py
      - name: Regenerate unchanged CE1AI parent physical dependencies
        run: python research/ce1ai_20261031/source/ce1ai_source_response.py
      - name: Regenerate unchanged CE1AH parent physical dependencies
        run: python research/ce1ah_20261031/source/ce1ah_tangent.py
      - name: Regenerate unchanged CE1AF parent physical dependencies
        run: python research/ce1af_20261030/source/shear_work_physics.py
      - name: Check exact sixth jet, nonlinear IVPs and original inherited suites
        run: |
          python -m pytest -q research/ce1ak_20261031/source/test_ce1ak_remote.py \
            research/ce1aj_20261031/source/test_ce1aj.py \
            research/ce1ai_20261031/source/test_ce1ai.py \
            research/ce1ai_20261031/source/test_dark_jet.py \
            research/ce1ah_20261031/source/test_ce1ah.py \
            research/ce1af_20261030/source/test_ce1af.py
      - name: Produce six real scientific figures
        run: python research/ce1ak_20261031/source/plot_ce1ak_remote.py
      - name: Check source Python syntax
        run: python -m compileall -q research/ce1ak_20261031/source
      - name: Pack source science 20 stages and original ancestor source
        run: python research/ce1ak_20261031/source/package_ce1ak_remote.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AK-original-dark-sixth-stress-Einstein-physics
          path: |
            research/ce1ak_20261031/data/
            research/ce1ak_20261031/figures/
            research/ce1ak_20261031/source/
            research/ce1ak_20261031/*.md
            research/ce1ak_20261031/checkpoints/
            research/ce1ak_20261031/dist/
          if-no-files-found: error
