name: BASS REI-F08 S0 original-source causal first Thomson scatter

on:
  push:
    branches:
      - research/bass-rei-s0-retarded-once-20261101
  pull_request:
    paths:
      - 'research/bass_rei_f08_s0_retarded_once_20261101/**'
      - '.github/workflows/bass-rei-s0-retarded-once.yml'

jobs:
  source-science:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent pinned numerical dependency
        run: python -m pip install 'numpy==2.4.2'
      - name: Verify real original F08 source and scientific counterexamples
        run: |
          python -m unittest discover -s research/bass_rei_f08_s0_retarded_once_20261101/tests -v
          python -O -m unittest discover -s research/bass_rei_f08_s0_retarded_once_20261101/tests -v
          python research/bass_rei_f08_s0_retarded_once_20261101/audit_observer.py
      - name: Cold recompute full source photon birth to observer Stokes
        run: |
          python research/bass_rei_f08_s0_retarded_once_20261101/retarded_once.py --out /tmp/rei_s0_retarded_cold --scatter 12 --birth 32 --inmu 8 --inphi 16 --outmu 16 --outphi 32 --simpson 8
      - name: Numerical and semantic readback on all original model rays
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv,gzip,json,math
          home=Path("research/bass_rei_f08_s0_retarded_once_20261101")
          old=json.loads((home/"results/RESULT.json").read_text())
          new=json.loads(Path("/tmp/rei_s0_retarded_cold/RESULT.json").read_text())
          assert old["source_f08_pair_id"]==new["source_f08_pair_id"]
          assert old["parent_bass_head"]==new["parent_bass_head"]
          assert old["source_original_F08_photon_state_equivalence"] is False
          assert new["source_original_F08_photon_state_equivalence"] is False
          assert old["sky_rows"]==new["sky_rows"]==2048
          assert old["chronology_rows"]==new["chronology_rows"]==48
          assert old["rei_central"]==new["rei_central"]=="28/88_REPORTED"
          assert old["new_rei_canonical_nodes"]==new["new_rei_canonical_nodes"]==0
          for name,fields in [
            ("RETARDED_ONCE_THOMSON_OBSERVER_STOKES.csv.gz",
             ("I1_ev_per_H_sr","Q1_ev_per_H_sr","U1_ev_per_H_sr","N1_photons_per_H_sr",
              "P1_over_I1","mean_birth_time_s","mean_scatter_time_s")),
            ("RETARDED_ONCE_SCATTER_TIME_CHRONOLOGY.csv.gz",
             ("sky_mean_local_I_gain_ev_per_H_sr_s","scatter_time_s",
              "scatter_quadrature_weight_s"))
          ]:
            with gzip.open(home/"results"/name,"rt",newline="") as f:
              a=list(csv.DictReader(f))
            with gzip.open(Path("/tmp/rei_s0_retarded_cold")/name,"rt",newline="") as f:
              b=list(csv.DictReader(f))
            assert len(a)==len(b)
            for x,y in zip(a,b):
              assert x["branch"]==y["branch"]
              assert x["observer_time_s"]==y["observer_time_s"]
              if "mu_index" in x:
                assert x["mu_index"]==y["mu_index"] and x["phi_index"]==y["phi_index"]
              for k in fields:
                v1,v2=float(x[k]),float(y[k])
                assert math.isfinite(v1) and math.isfinite(v2)
                assert math.isclose(v1,v2,rel_tol=2e-8,abs_tol=1e-19),(name,k,v1,v2)
            print("REI_SOURCE_SCOPED_RETARDED_NUMERIC_READBACK_PASS",name,len(a))
          print("REI_CANONICAL_REMAINS_HOLD_28_OF_88")
          PY
      - name: Preserve recalculated physical outputs
        uses: actions/upload-artifact@v4
        with:
          name: rei-f08-s0-retarded-once-physical-science
          path: /tmp/rei_s0_retarded_cold/
          if-no-files-found: error
