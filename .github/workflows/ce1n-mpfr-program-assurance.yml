name: CE1-N MPFR directed program-premise scoped assurance
on:
  push:
    branches: [research/bass-ce1n-mpfr-direct-api-proof-safety-20261029-r1]
  pull_request:
    branches: [research/bass-ce1m-pr249-physical-lock-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1n-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-mpfr:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTHONPATH: '.'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Frozen directed oracle dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: MPFR current-source and subcell adversarial plus inherited 15 CE1 regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1n_mpfr_program_assurance.py \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1k_canonical_source_local.py \
            tests/nonperturbative/test_ce1k_cardinality_contract.py \
            tests/nonperturbative/test_ce1l_physical_table_identity.py \
            tests/nonperturbative/test_ce1l_positive_stored_residual.py \
            tests/nonperturbative/test_ce1m_integrated_adversarial.py \
            tests/nonperturbative/test_einstein_error_budget.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_tabulated_time.py
      - name: Fixed original 384-ray input science replay
        run: |
          set -euo pipefail
          python research/ce1m_20261029/REF8_REPLAY.py
      - name: Installed-wheel direct-certifier fail-closed and current-source majorant
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1n_wheels
          python -m pip install --no-deps --target /tmp/ce1n_installed /tmp/ce1n_wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1n_installed python - <<'PY'
          from bianchi.nonperturbative.einstein_error_budget import PolynomialRadiation
          from bianchi.nonperturbative.einstein_interval import source_full_rounding_bound, residual_taylor_mpfr
          s=PolynomialRadiation(ntheta=8,backend='python_oracle')
          v=source_full_rounding_bound(s,[0.]*3,[0.]*3,max_K=3)
          s.mass=s.mass.copy()*2
          current=source_full_rounding_bound(s,[0.]*3,[0.]*3,max_K=3)
          assert max(current['bounds'])>0.29
          assert max(v['bounds'])<1e-9
          try:
              residual_taylor_mpfr(s,None,0,subcells=-1)
          except ValueError as e:
              assert 'subcells' in str(e)
          else:
              raise AssertionError('Invalid subcells silently returned zero MPFR residual')
          print('CE1N_INSTALLED_WHEEL_DIRECT_MPFR_SAFETY_PASS')
          PY
