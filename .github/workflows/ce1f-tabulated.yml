name: CE1-F positive tabulated source certificate
on:
  push:
    branches: [research/bass-ce1f-tabulated-angular-certificate-20261029]
    paths:
      - bianchi/nonperturbative/einstein_tabulated_source.py
      - tests/nonperturbative/test_einstein_tabulated_source.py
      - .github/workflows/ce1f-tabulated.yml
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_tabulated_source.py
      - tests/nonperturbative/test_einstein_tabulated_source.py
      - .github/workflows/ce1f-tabulated.yml
permissions:
  contents: read
jobs:
  scoped-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Actual tabulated-source tests and inherited Einstein certificates
        run: >
          python -m pytest -q
          tests/nonperturbative/test_einstein_tabulated_source.py
          tests/nonperturbative/test_einstein_exponential_source.py
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py
      - name: Installed wheel numerical certificate
        run: |
          python -m pip wheel --no-deps . -w /tmp/ce1f-wheels
          python -m pip install --no-deps --target /tmp/ce1f-wheel /tmp/ce1f-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1f-wheel python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation, certified_tabulated_geometry
          s=TabulatedRadiation([0,1],[0,1],[[.9]],refinement=4,backend='python_oracle')
          c=certified_tabulated_geometry(s,end=.04)
          assert c['source_pressure_upper']>0 and not c['time_integration_error_included']
          print('INSTALLED_WHEEL_TABULATED_SOURCE_PASS')
          PY
