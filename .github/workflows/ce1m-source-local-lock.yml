name: CE1-M source-local physical-lock integration
on:
  push:
    branches: [research/bass-ce1m-pr249-physical-lock-20261029-r1]
  pull_request:
    branches: [research/bass-ce1l-r6c9-physical-lock-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1m-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-ce1m:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Frozen scoped Python oracle dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: Full scoped CE1-G/H/I/J/K/L/M including adversarial proofs
        run: |
          set -euo pipefail
          # The CE1-M scope is the 15 top-level CE1 modules; recursive
          # directory collection would include unrelated Bianchi-V SymPy lanes.
          python -m pytest -q \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1k_canonical_source_local.py \
            tests/nonperturbative/test_ce1k_cardinality_contract.py \
            tests/nonperturbative/test_ce1l_physical_table_identity.py \
            tests/nonperturbative/test_ce1l_positive_stored_residual.py \
            tests/nonperturbative/test_ce1m_integrated_adversarial.py \
            tests/nonperturbative/test_einstein_error_budget.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_tabulated_time.py
      - name: Exact original input ref8 384-ray rerun, not a benchmark
        run: |
          set -euo pipefail
          python research/ce1m_20261029/REF8_REPLAY.py
      - name: Installed wheel retains fail-closed physical lock and source-local result
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1m_wheels
          python -m pip install --no-deps --target /tmp/ce1m_installed /tmp/ce1m_wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1m_installed python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_source_canonical import run_canonical_panel_source
          s=TabulatedRadiation([0,.5,1],[0,.25,.75,1],
              [[.1,.25,.05],[.2,.15,.15]],backend='python_oracle')
          r=run_canonical_panel_source(s,backend='python_oracle',steps=4)
          assert r['total_h_upper']<=r['ce1i_total_h_upper']
          assert r['production_ready'] is False
          s.cell_energy=s.cell_energy.copy()
          s.cell_energy[0,0]+=.1
          try:
              run_canonical_panel_source(s,backend='python_oracle',steps=4)
          except ValueError as error:
              assert 'Immutable physical' in str(error)
          else:
              raise AssertionError('CE1M_WHEEL_PHYSICAL_LOCK_NOT_ENFORCED')
          print('CE1M_WHEEL_SOURCE_LOCAL_PHYSICAL_LOCK_PASS')
          PY
