name: KM2F source-locked Einstein Bianchi I polarized photons and cold electrons
on:
  push:
    branches: [research/bass-km2f-einstein-momentum-constraints-20261030-r1]
  pull_request:
    branches: [research/bass-km2e-electron-photon-recoil-20261030-r1]
permissions:
  contents: read
jobs:
  source-locked-einstein-matter-constraints:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      BASS_KM2F_RESULT: /tmp/km2f/actual_full_einstein_science.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin exact original BASS polarized photon and cold electron sources
        run: |
          set -euo pipefail
          test "$(git hash-object research/dual_lane_km2c_20261028/code/curved_tilt.py)" = 05aade3aab7e9a32c11608882c943e4d3cb6f379
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/tilted_collision.py)" = 92660768f4719d78261fed1cb44f186d2821629d
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/source_memory.py)" = 9d500e36fefaa4ddc22300a2f03d9eb9cfe98403
          test "$(git hash-object research/dual_lane_km2d_20261030/accelerating_tilt.py)" = b599d3842e843d8de1de1499b73e6849374bf8f8
          test "$(git hash-object research/dual_lane_km2e_20261030/coupled_electron_photon.py)" = 12fbce8109fc07b1fbf60d9a066d8aa1c57ea9c1
          git rev-parse HEAD
      - name: Install deterministic scientific Python dependencies
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          python -m compileall -q research/dual_lane_km2f_20261030
      - name: Create and verify S0 original photon plus Einstein theorem checkpoint
        run: |
          mkdir -p /tmp/km2f
          python research/dual_lane_km2f_20261030/package_artifacts.py \
            --stage S0 --output /tmp/km2f/BASS_KM2F_S0.zip
      - name: Upload S0 original-physics-source checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2F_S0_ORIGINAL_THEORY
          path: /tmp/km2f/BASS_KM2F_S0.zip
          retention-days: 60
          if-no-files-found: error
      - name: Actually generate full Einstein plus photon electron constraint coupled physics
        run: |
          python research/dual_lane_km2f_20261030/einstein_bianchi.py \
            --output /tmp/km2f/actual_full_einstein_science.json
      - name: Verify and preserve S1 actual coupled gravity source and measured data
        run: |
          python research/dual_lane_km2f_20261030/package_artifacts.py \
            --stage S1 --results /tmp/km2f/actual_full_einstein_science.json \
            --output /tmp/km2f/BASS_KM2F_S1.zip
      - name: Upload S1 full original BASS source and real gravitational IVP data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2F_S1_ORIGINAL_SOURCE_EINSTEIN_PHYSICS
          path: /tmp/km2f/BASS_KM2F_S1.zip
          retention-days: 60
          if-no-files-found: error
      - name: Run actual source guard, Hamiltonian, momentum, shear and independent beta ODE tests
        run: python -m pytest -q research/dual_lane_km2f_20261030/tests/test_einstein_bianchi.py
      - name: Preserve final full original-sources and report/handoff scientific ZIP
        run: |
          python research/dual_lane_km2f_20261030/package_artifacts.py \
            --stage S2 --results /tmp/km2f/actual_full_einstein_science.json \
            --output /tmp/km2f/BASS_KM2F_S2.zip
      - name: Upload S2 complete Einstein physics and full original data archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2F_S2_FULL_EINSTEIN_RESEARCH
          path: |
            /tmp/km2f/BASS_KM2F_S2.zip
            /tmp/km2f/actual_full_einstein_science.json
          retention-days: 60
          if-no-files-found: error
