name: KM-2E reciprocal electron momentum + full original polarized photon radiation
on:
  push:
    branches: [research/bass-km2e-electron-photon-recoil-20261030-r1]
  pull_request:
    branches: [research/bass-km2d-accelerating-electron-tilt-20261030-r1]
permissions:
  contents: read
jobs:
  km2e-reciprocal-cold-electron-physical-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      KM2E_RESULT: /tmp/km2e/physical_science.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Pin inherited normal Bianchi photon geometry and original finite-beta Thomson code
        run: |
          set -euo pipefail
          test "$(git hash-object research/dual_lane_km2d_20261030/accelerating_tilt.py)" = b599d3842e843d8de1de1499b73e6849374bf8f8
          test "$(git hash-object research/dual_lane_km2c_20261028/code/curved_tilt.py)" = 05aade3aab7e9a32c11608882c943e4d3cb6f379
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/tilted_collision.py)" = 92660768f4719d78261fed1cb44f186d2821629d
          test "$(git hash-object research/dual_lane_km2c_20261028/vendor/source_memory.py)" = 9d500e36fefaa4ddc22300a2f03d9eb9cfe98403
          git rev-parse HEAD
      - name: Preserve original full source and S0 physical theorem before compute
        run: |
          mkdir -p /tmp/km2e
          python research/dual_lane_km2e_20261030/package_artifacts.py \
            --stage S0 --output /tmp/km2e/BASS_KM2E_S0.zip
      - name: Upload exact S0 source and theory checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2E_S0_ORIGINAL_THEORY
          path: /tmp/km2e/BASS_KM2E_S0.zip
          retention-days: 60
          if-no-files-found: error
      - name: Install declared scientific runtime and compile new code
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
          python -m compileall -q research/dual_lane_km2e_20261030
      - name: Execute actual reciprocal electron-photon original P8 physical IVPs and work histories
        run: |
          python research/dual_lane_km2e_20261030/coupled_electron_photon.py \
            --output /tmp/km2e/physical_science.json
      - name: Preserve S1 newly generated radiation and cold-electron physics with parent complete source
        run: |
          python research/dual_lane_km2e_20261030/package_artifacts.py \
            --stage S1 --results /tmp/km2e/physical_science.json \
            --output /tmp/km2e/BASS_KM2E_S1.zip
      - name: Upload S1 original source-inclusive physical radiation and electron data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2E_S1_ACTUAL_RECIPROCAL_PHYSICS
          path: /tmp/km2e/BASS_KM2E_S1.zip
          retention-days: 60
          if-no-files-found: error
      - name: Independently check matter 4-force, conserved cold number, total stress and hostile source guards
        run: |
          python -m pytest -q research/dual_lane_km2e_20261030/tests/test_coupled_physics.py
      - name: Preserve verified original radiation+matter S2 package and complete handoff
        run: |
          python research/dual_lane_km2e_20261030/package_artifacts.py \
            --stage S2 --results /tmp/km2e/physical_science.json \
            --output /tmp/km2e/BASS_KM2E_S2.zip
      - name: Upload S2 immutable full physics research, raw JSON and traceable CSV
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_KM2E_S2_COMPLETE_PHYSICAL_RESEARCH
          path: |
            /tmp/km2e/BASS_KM2E_S2.zip
            /tmp/km2e/physical_science.json
          retention-days: 60
          if-no-files-found: error
