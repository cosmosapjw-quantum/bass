name: CE1D physical input error enclosure
on:
  push:
    branches: [research/bass-ce1d-physical-input-enclosure-20261029]
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_input_enclosure.py
      - tests/nonperturbative/test_einstein_physical_input.py
      - .github/workflows/ce1d-input-enclosure.yml
permissions:
  contents: read
jobs:
  scoped-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Test physical-input box, previous MPFR and source-error contract
        run: >
          python -m pytest
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py -q
      - name: Installed-wheel physical-input smoke
        run: |
          python -m pip wheel --no-deps . -w /tmp/bass-ce1d-wheels
          python -m pip install --no-deps --target /tmp/bass-ce1d-wheel /tmp/bass-ce1d-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/bass-ce1d-wheel python - <<'PY'
          from bianchi.nonperturbative.einstein_error_budget import PolynomialRadiation
          from bianchi.nonperturbative.einstein_input_enclosure import enclose_physical_inputs
          s=PolynomialRadiation(ntheta=8,backend='python_oracle')
          r=enclose_physical_inputs(s,energy=('0.9','1e-8'),
              coefficients=(('0.6','1e-7'),('0.25','1e-7'),('0.2','1e-7')),
              shear=(('0.2','1e-8'),('-0.13','1e-8')),backend='python_oracle')
          assert r['status']=='ADMITTED_POSITIVE_EXPANDING_INPUT_BOX'
          assert r['input_h_upper']<2e-6
          print('INSTALLED_WHEEL_INPUT_ENCLOSURE_PASS; native NOT_RUN')
          PY
