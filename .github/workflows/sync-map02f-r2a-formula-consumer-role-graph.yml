name: sync-map02f-r2a-formula-consumer-role-graph

on:
  pull_request:
    paths:
      - ".github/workflows/sync-map02f-r2a-formula-consumer-role-graph.yml"
      - "docs/bass_master_ssot_v2/SYNC_MAP_02F_R2A/**"
      - "scripts/verify_sync_map02f_r2a_role_graph.py"
      - "scripts/run_sync_map02f_r2a_role_graph_local.sh"
      - "tests/test_sync_map02f_r2a_role_graph.py"
      - "wolfram/BASS/Kernel/IR/FormulaConsumerRoleGraphR2A.wl"
      - "wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt"
      - "wolfram/scripts/run_formula_consumer_role_graph_r2a.wls"
  push:
    branches:
      - "research/bass-master-ssot-v2-sync-map02f-r2a-role-graph-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract-and-source-packet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify graph
        run: >-
          python scripts/verify_sync_map02f_r2a_role_graph.py
          --graph docs/bass_master_ssot_v2/SYNC_MAP_02F_R2A/FORMULA_CONSUMER_ROLE_GRAPH.json
      - name: Run mutation-sensitive tests
        run: python -m unittest -v tests/test_sync_map02f_r2a_role_graph.py
      - name: Compile Python surfaces
        run: |
          python -m py_compile \
            scripts/verify_sync_map02f_r2a_role_graph.py \
            tests/test_sync_map02f_r2a_role_graph.py
      - name: Check exact top-level MUnit discovery surface
        shell: bash
        run: |
          set -euo pipefail
          count="$(grep -c '^VerificationTest\[' wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt)"
          test "$count" -eq 11
          ! grep -F '$InputFileName' wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt
          ! grep -F 'Get[' wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt
          ! grep -F 'Import[' wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt
      - name: Check normal ancestry and text hygiene
        shell: bash
        run: |
          set -euo pipefail
          BASE=6bb65476a87d1ac8daa9f7239d884c369c51ce33
          git cat-file -e "${BASE}^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --check "$BASE"...HEAD
      - name: Build BASS-only local-replay source packet
        shell: bash
        run: |
          set -euo pipefail
          packet="$RUNNER_TEMP/sync-map02f-r2a-role-graph"
          mkdir -p "$packet"
          paths=(
            docs/bass_master_ssot_v2/SYNC_MAP_02F_R2A/FORMULA_CONSUMER_ROLE_GRAPH.json
            docs/bass_master_ssot_v2/SYNC_MAP_02F_R2A/README.md
            scripts/verify_sync_map02f_r2a_role_graph.py
            scripts/run_sync_map02f_r2a_role_graph_local.sh
            tests/test_sync_map02f_r2a_role_graph.py
            wolfram/BASS/Kernel/IR/FormulaConsumerRoleGraphR2A.wl
            wolfram/BASS/Tests/FormulaConsumerRoleGraphR2A.wlt
            wolfram/scripts/run_formula_consumer_role_graph_r2a.wls
          )
          for path in "${paths[@]}"; do
            mkdir -p "$packet/$(dirname "$path")"
            cp "$path" "$packet/$path"
          done
          {
            printf 'head=%s\n' "$(git rev-parse HEAD)"
            printf 'tree=%s\n' "$(git show -s --format=%T HEAD)"
            printf 'repository_scope=BASS_ONLY\n'
            for path in "${paths[@]}"; do
              printf '%s  %s\n' "$(git rev-parse "HEAD:$path")" "$path"
            done
          } > "$packet/GIT_OBJECT_MANIFEST.txt"
          (cd "$packet" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum) \
            > "$packet/SHA256SUMS"
      - name: Upload BASS-only source packet
        uses: actions/upload-artifact@v4
        with:
          name: sync-map02f-r2a-bass-only-role-graph
          path: ${{ runner.temp }}/sync-map02f-r2a-role-graph
          if-no-files-found: error
          retention-days: 30
