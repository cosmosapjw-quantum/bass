name: RF-BENCH-00 runner contract

on:
  pull_request:
    paths:
      - "benchmarks/__init__.py"
      - "benchmarks/bench_rfbench00.py"
      - "benchmarks/rfbench/**"
      - "benchmarks/corpora/**"
      - "tests/test_rfbench00_*.py"
      - "docs/rust_first_runtime/SPEC.json"
      - "docs/rust_first_runtime/README.md"
      - "docs/rust_first_runtime/HANDOFF.md"
      - "artifacts/rust_first_runtime/rfbench00/**"
      - "requirements.lock"
      - "pyproject.toml"
      - "bootstrap.sh"
      - "bianchi/**"
      - "_rustcore/**"
      - ".cargo/**"
      - "rust-toolchain*"
      - "vendor/**"
      - "generated/rust/**"
      - ".github/workflows/rfbench00-runner.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rfbench00-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RAYON_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"

jobs:
  runner-contract:
    name: Static runner contract (no benchmark)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Select CPython
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install exact locked Python inputs
        run: python -m pip install --requirement requirements.lock
      - name: Enforce RF-BENCH-00 native-input reuse boundary
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'agent/architecture/rust-first-rf-bench-00-20260825-r1'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          native_paths=(
            _rustcore/Cargo.toml _rustcore/Cargo.lock _rustcore/pyproject.toml
            _rustcore/src _rustcore/build.rs _rustcore/benches _rustcore/.cargo
            .cargo rust-toolchain rust-toolchain.toml _rustcore/vendor vendor
            generated/rust
          )
          if ! git diff --quiet "$BASE_SHA...HEAD" -- "${native_paths[@]}"; then
            echo "RF-BENCH-00 cannot reuse native r3 after a native-input change" >&2
            git diff --name-only "$BASE_SHA...HEAD" -- "${native_paths[@]}" >&2
            exit 2
          fi
      - name: Prove focused runner contracts
        env:
          PIP_NO_INDEX: "1"
          CARGO_NET_OFFLINE: "true"
          PYTHONPATH: "."
        run: >-
          python -m pytest -q
          tests/test_rfbench00_host.py
          tests/test_rfbench00_protocol.py
          tests/test_rfbench00_corpus_runner.py
      - name: Validate static CLI description and configuration
        env:
          PIP_NO_INDEX: "1"
          CARGO_NET_OFFLINE: "true"
          PYTHONPATH: "."
        shell: bash
        run: |
          description="$RUNNER_TEMP/rfbench00-corpus-description.json"
          config="$RUNNER_TEMP/rfbench00-static-config.json"
          validation="$RUNNER_TEMP/rfbench00-config-validation.json"

          python benchmarks/bench_rfbench00.py \
            --describe-corpus \
            --corpus benchmarks/corpora/whole_runtime_v1.json \
            --output "$description"

          python - "$config" <<'PY'
          import json
          from pathlib import Path
          import sys

          from benchmarks.rfbench.corpus import CORPUS_PATH, sha256_file
          from benchmarks.rfbench.protocol import CONTAMINATION_LIMITS, sha256_json
          from benchmarks.rfbench.runner import (
              EXPECTED_ADAPTER_SHA256,
              EXPECTED_SPEC_SHA256,
          )

          command = [
              "{python}",
              "{runner_root}/benchmarks/rfbench/workload_child.py",
              "--workload-id",
              "startup_cold_backend_import",
          ]
          common_build = {
              "cargo_lock_sha256": "d500208e9353ade1cb74693918598846628219e6e7bd2e2bce9ec85e29eb6310",
              "rustc_version": "1.94.1",
              "python_abi": "cp312-cp312-manylinux_2_34_x86_64",
              "build_profile": "release",
              "cpu_variant": "strict-portable",
              "optional_features": [],
          }

          payload = {
              "schema": "bass-rfbench-run-config-v1",
              "requested_claim_level": "CONTROLLED_SHARED_PAIRED",
              "workload_id": "startup_cold_backend_import",
              "phase": "tuning",
              "stratum": "strict_1t",
              "baseline": {
                  "root": "/static-baseline",
                  "ref": "1" * 40,
                  "python": sys.executable,
                  "command": command,
                  "environment_identity_sha256": "3" * 64,
                  "native_artifact_sha256": "4" * 64,
              },
              "candidate": {
                  "root": "/static-candidate",
                  "ref": "2" * 40,
                  "python": sys.executable,
                  "command": command,
                  "environment_identity_sha256": "3" * 64,
                  "native_artifact_sha256": "5" * 64,
              },
              "valid_pairs_target": 30,
              "max_attempts": 90,
              "bootstrap_replicates": 10_000,
              "seed": 20260825,
              "contamination_limits": CONTAMINATION_LIMITS,
              "corpus_sha256": sha256_file(CORPUS_PATH),
              "spec_sha256": EXPECTED_SPEC_SHA256,
              "source_adapter_sha256": EXPECTED_ADAPTER_SHA256,
              "common_build_identity": common_build,
              "common_build_identity_sha256": sha256_json(common_build),
          }
          Path(sys.argv[1]).write_text(
              json.dumps(payload, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          PY

          python benchmarks/bench_rfbench00.py \
            --validate-config "$config" \
            --corpus benchmarks/corpora/whole_runtime_v1.json \
            --output "$validation"

          python - "$description" "$validation" <<'PY'
          import json
          from pathlib import Path
          import sys

          description = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          validation = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          assert description["schema"] == "bass-whole-runtime-corpus-v1"
          assert validation == {
              "schema": "bass-rfbench-config-validation-v1",
              "status": "PASS_STATIC_ONLY",
              "workload_id": "startup_cold_backend_import",
              "candidate_resolved": False,
              "workload_executed": False,
          }
          PY
