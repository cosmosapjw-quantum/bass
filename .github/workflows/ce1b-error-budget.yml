name: CE1B source and time error budget
on:
  push:
    branches: [research/bass-ce1b-source-time-budget-20261028]
    paths:
      - bianchi/nonperturbative/einstein_error_budget.py
      - tests/nonperturbative/test_einstein_error_budget.py
      - .github/workflows/ce1b-error-budget.yml
permissions:
  contents: read
jobs:
  package-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Targeted package tests and parent moment compatibility
        run: |
          PYTHONPATH=. python -m pytest tests/nonperturbative/test_einstein_error_budget.py -q --junitxml=/tmp/ce1b-tests.xml
          PYTHONPATH=. python - <<'PY'
          import numpy as np
          from bianchi.nonperturbative.einstein_error_budget import PolynomialRadiation
          from bianchi.nonperturbative.einstein_vlasov import AngularRadiation
          s=PolynomialRadiation(ntheta=12,backend='python_oracle')
          p=AngularRadiation(s.n,s.weights,s.density)
          for ell in ([0,0,0],[.4,.1,.2],[.8,.7,.4]):
              e,a=s.moments(ell);f,b=p.moments(ell)
              assert abs(e-f)<2e-11 and np.max(abs(a-b))<2e-11
          print('PARENT_MOMENT_COMPATIBILITY_PASS')
          PY
      - name: Installed wheel numerical budget
        run: |
          python -m pip wheel --no-deps . -w /tmp/ce1b-wheel
          python -m pip install --no-deps --target /tmp/ce1b-install /tmp/ce1b-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1b-install python - <<'PY'
          from bianchi.nonperturbative.einstein_error_budget import PolynomialRadiation,rk4_path,audit_path
          s=PolynomialRadiation(ntheta=12,backend='python_oracle')
          p=rk4_path(s,s.initial_state(),.2,8,backend='python_oracle')
          a=audit_path(s,p)
          assert a['final_total'][1]<1e-3 and not a['floating_point_certificate']
          print('INSTALLED_WHEEL_ERROR_BUDGET_PASS; native NOT_RUN')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ce1b-${{ github.sha }}
          path: /tmp/ce1b-tests.xml
          retention-days: 30
