name: BASS KM2 source-locked photon Thomson visibility
on:
  push:
    branches:
      - research/bass-km2-visibility-20261101-r1
  pull_request:
    paths:
      - 'research/dual_lane_km2_visibility_20261101/**'
      - '.github/workflows/km2-source-visibility.yml'
permissions:
  contents: read
  actions: read
jobs:
  original_source_visibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed source-arithmetic runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8
      - name: Restore exact already executed source KM2N original GitHub S2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/cosmosapjw-quantum/bass/actions/artifacts/13035232055/zip' \
            --output /tmp/bass_km2n_source_ci.zip
          python research/dual_lane_km2_visibility_20261101/restore_pinned_km2n.py \
            --artifact /tmp/bass_km2n_source_ci.zip \
            --dest research/dual_lane_km2_visibility_20261101
      - name: Generate actual 800 source-owned ray visibility profiles
        run: python research/dual_lane_km2_visibility_20261101/source_visibility.py
      - name: Source and physical regression, normal and optimized mode
        run: |
          python -m unittest discover -s research/dual_lane_km2_visibility_20261101 -p test_visibility.py -v
          python -O -m unittest discover -s research/dual_lane_km2_visibility_20261101 -p test_visibility.py -q
          python -m compileall -q research/dual_lane_km2_visibility_20261101
      - name: Create science figures
        run: python research/dual_lane_km2_visibility_20261101/make_plots.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2_ORIGINAL_GL12_GL16_PHYSICAL_VISIBILITY
          if-no-files-found: error
          path: |
            research/dual_lane_km2_visibility_20261101/results/
            research/dual_lane_km2_visibility_20261101/figures/
            research/dual_lane_km2_visibility_20261101/SOURCE_MANIFEST.json
            research/dual_lane_km2_visibility_20261101/SCIENCE_REPORT_KO.md
            research/dual_lane_km2_visibility_20261101/source_inputs/