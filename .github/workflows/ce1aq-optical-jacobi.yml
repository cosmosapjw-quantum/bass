name: CE1AQ original-sixcell optical-beam Sachs/Saunders physics
on:
  push:
    branches:
      - research/bass-ce1aq-optical-jacobi-20261101-r1
  pull_request:
    paths:
      - 'research/ce1aq_20261101/**'
      - '.github/workflows/ce1aq-optical-jacobi.yml'
permissions:
  contents: read
jobs:
  source_owned_optical_beams:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed science runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Reconstruct immutable parent source CE1AP original Einstein-Vlasov rays
        run: python research/ce1ap_20261031/source/ce1ap_remote.py
      - name: Compute genuine 7416 screen beam rows and 2472 original source responses
        run: python research/ce1aq_20261101/source/ce1aq_remote.py
      - name: Check source owner, optical Jacobi-Saunders parity and physical controls
        run: python -m pytest -q research/ce1aq_20261101/source/test_ce1aq_remote.py
      - name: Compile scientific Python
        run: python -m compileall -q research/ce1aq_20261101/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AQ-original-sixcell-9888-real-optical-observables
          path: |
            research/ce1aq_20261101/data/
            research/ce1aq_20261101/source/
            research/ce1aq_20261101/reports/
            research/ce1ap_20261031/data/CE1AP_REMOTE_RESULTS.json
          if-no-files-found: error
