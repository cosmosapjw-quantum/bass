name: CE1AJ continuum dark l4 finite-time original physical source
on:
  push:
    branches: [research/bass-ce1aj-finite-continuum-dark-l4-transfer-20261031-r1]
  pull_request:
    paths:
      - 'research/ce1aj_20261031/**'
      - '.github/workflows/ce1aj-finite-dark-transfer.yml'
jobs:
  original_dark_physics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install matched physics runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Exact rational original-continuum finite transfer comparison
        run: python research/ce1aj_20261031/source/certify_finite_transfer.py
      - name: Generate 9624 new real Einstein-Vlasov dark-source physics records
        run: python research/ce1aj_20261031/source/ce1aj_physics.py
      - name: Reproduce immutable CE1AI ancestor outputs for inherited test dependencies
        run: python research/ce1ai_20261031/source/ce1ai_source_response.py
      - name: Reproduce immutable CE1AH ancestor outputs for inherited test dependencies
        run: python research/ce1ah_20261031/source/ce1ah_tangent.py
      - name: Reproduce immutable CE1AF ancestor outputs for inherited test dependencies
        run: python research/ce1af_20261030/source/shear_work_physics.py
      - name: New science and original CE1AI CE1AH CE1AF regression tests
        run: python -m pytest -q research/ce1aj_20261031/source/test_ce1aj.py research/ce1ai_20261031/source/test_ce1ai.py research/ce1ai_20261031/source/test_dark_jet.py research/ce1ah_20261031/source/test_ce1ah.py research/ce1af_20261030/source/test_ce1af.py
      - name: Generate five original scientific figures
        run: python research/ce1aj_20261031/source/plot_ce1aj.py
      - name: Compile CE1AJ scientific code
        run: python -m compileall -q research/ce1aj_20261031/source
      - name: Package SHA/CRC verified S0 S1 source-inclusive S2 and 20 phase ZIPs
        run: python research/ce1aj_20261031/source/package_ce1aj.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AJ_EXACT_DARK_FINITE_TRANSFER_AND_ORIGINAL_IVP
          path: |
            research/ce1aj_20261031/data/
            research/ce1aj_20261031/figures/
            research/ce1aj_20261031/THEORY_KO.md
            research/ce1aj_20261031/REPORT_KO.md
            research/ce1aj_20261031/BLIND_REFEREE_KO.md
            research/ce1aj_20261031/REPRODUCE.md
            research/ce1aj_20261031/source/
            research/ce1aj_20261031/checkpoints/
            research/ce1aj_20261031/dist/
          if-no-files-found: error
