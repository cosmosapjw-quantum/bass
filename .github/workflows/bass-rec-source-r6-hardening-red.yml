name: BASS REC source protocol R6 authority hardening GREEN

on:
  pull_request:
    paths:
      - "bianchi/source_authority.py"
      - "tests/research/test_bass_rec_source_protocol_red.py"
      - "tests/research/test_bass_rec_source_protocol_r6_red.py"
      - "docs/research/bass_rec_source_r6_hardening_green/**"
      - ".github/workflows/bass-rec-source-r6-hardening-red.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bass-rec-source-r6-green-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authority-hardening-green:
    name: R6 stable survivors and authority hardening
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Select CPython 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile R6 source module
        run: python -m py_compile bianchi/source_authority.py
      - name: Run stable R5 survivor contract
        run: python -m unittest -v tests/research/test_bass_rec_source_protocol_red.py
      - name: Run R6 authority-hardening contract
        run: python -m unittest -v tests/research/test_bass_rec_source_protocol_r6_red.py
