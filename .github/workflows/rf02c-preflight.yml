name: RF-02C ordered preflight

on:
  push:
    branches:
      - "agent/architecture/rust-first-rf02c-20260826-r1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.12"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  RF02B_ARTIFACT_ID: "9574570565"
  RF02B_WHEEL_SHA256: "f1b5940ed453c744b3a285898f079b9a8b0e43f66d99937fd7fa632f49d8c3f6"

jobs:
  ordered-preflight:
    name: Package identity, starting RED, scope, and V2 semantics closure
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify the compiled package manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/rust_first_runtime/rf02c
          (
            cd docs/audits/science_system_differential_20260826
            sha256sum -c MANIFEST.sha256
          ) | tee artifacts/rust_first_runtime/rf02c/MANIFEST_CHECK.log

      - name: Resolve the live package identities fail closed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python docs/audits/science_system_differential_20260826/validate_package.py \
            --root docs/audits/science_system_differential_20260826 \
            --live \
            | tee artifacts/rust_first_runtime/rf02c/PACKAGE_LIVE.log

      - name: Restore and hash the exact immutable RF-02B wheel
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/rf02b-wheel.zip"
          restore="$RUNNER_TEMP/rf02b-wheel"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RF02B_ARTIFACT_ID}/zip" > "$archive"
          mkdir -p "$restore"
          unzip -q "$archive" -d "$restore"
          mapfile -t wheels < <(find "$restore" -type f -name 'bianchi_rustcore-*.whl' -print)
          [[ "${#wheels[@]}" -eq 1 ]]
          observed="$(sha256sum "${wheels[0]}" | awk '{print $1}')"
          printf '%s  %s\n' "$observed" "${wheels[0]}" \
            | tee artifacts/rust_first_runtime/rf02c/RF02B_WHEEL_SHA256.log
          if [[ "$observed" != "$RF02B_WHEEL_SHA256" ]]; then
            echo "RF-02B wheel SHA mismatch: expected $RF02B_WHEEL_SHA256, observed $observed" >&2
            exit 1
          fi
          printf 'RF02B_WHEEL=%s\n' "${wheels[0]}" >> "$GITHUB_ENV"
          python -m pip install --no-index --force-reinstall "${wheels[0]}"

      - name: Record the required starting RED without the development override
        shell: bash
        run: |
          set -euo pipefail
          env -u BASS_ALLOW_UNVERIFIED_NATIVE_DEV PYTHONPATH=. python - <<'PY' \
            | tee artifacts/rust_first_runtime/rf02c/STARTING_RED.log
          from bianchi.backend_policy import IncompatibleNativeExtensionError, require_native

          try:
              require_native("background.chart_rhs")
          except IncompatibleNativeExtensionError as exc:
              cause = exc.__cause__
              assert "rf02c_execution_identity" in str(exc)
              assert cause is not None
              assert "rf02c_execution_identity" in str(cause)
              print("EXPECTED_STARTING_RED=RF02C_EXECUTION_IDENTITY_REJECTED")
              print(f"{type(exc).__name__}: {exc}")
              print(f"cause={type(cause).__name__}: {cause}")
          else:
              raise SystemExit("RF-02B wheel was unexpectedly accepted by default dispatch")
          PY

      - name: Record development-only acceptance of the same wheel
        env:
          BASS_ALLOW_UNVERIFIED_NATIVE_DEV: "1"
          PYTHONPATH: .
        shell: bash
        run: |
          set -euo pipefail
          python -W always - <<'PY' \
            | tee artifacts/rust_first_runtime/rf02c/STARTING_OVERRIDE.log
          import warnings

          from bianchi.backend_policy import (
              BackendPolicy,
              NativeLoadState,
              UnverifiedNativeDevelopmentWarning,
              select_backend,
          )

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always", UnverifiedNativeDevelopmentWarning)
              selected = select_backend(
                  "background.chart_rhs",
                  policy="rust_required",
              )
          development_warnings = [
              item
              for item in caught
              if issubclass(item.category, UnverifiedNativeDevelopmentWarning)
          ]
          assert len(development_warnings) == 1
          assert selected.route_id == "background.chart_rhs"
          assert selected.policy is BackendPolicy.RUST_REQUIRED
          assert selected.load_state is NativeLoadState.AVAILABLE
          assert selected.native_module is not None
          assert callable(getattr(selected.native_module, "chart_rhs", None))
          assert selected.installed_payload_verified is True
          assert selected.development_override is True
          assert selected.diagnostic is not None
          assert selected.diagnostic.startswith("RF02B_DEVELOPMENT_ONLY_NATIVE_PAYLOAD:")
          assert str(development_warnings[0].message) == selected.diagnostic
          print("EXPECTED_DEVELOPMENT_OVERRIDE=ACCEPTED_WITH_DIAGNOSTIC")
          print(selected.diagnostic)
          PY

      - name: Evaluate RF-02C precondition versus compiled allowlist
        id: scope
        env:
          PYTHONPATH: .
        shell: bash
        run: |
          set +e
          set -uo pipefail
          python tools/audit/rf02c_preflight.py \
            --root . \
            --output artifacts/rust_first_runtime/rf02c/PREFLIGHT.json \
            | tee artifacts/rust_first_runtime/rf02c/PREFLIGHT.log
          rc=${PIPESTATUS[0]}
          set -e
          printf 'exit_code=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate callback-free V2 execution semantics
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit/rf02c_semantics_v2.py \
            --contract docs/rust_first_runtime/RF02C_EXECUTION_CONTRACT_V2.json \
            --v1 docs/rust_first_runtime/RF02C_EXECUTION_CONTRACT_V1.json \
            --output artifacts/rust_first_runtime/rf02c/SEMANTICS_V2_VALIDATION.json \
            | tee artifacts/rust_first_runtime/rf02c/SEMANTICS_V2_VALIDATION.log

      - name: Run exact multiple and tangential root oracle
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit/rf02c_event_root_oracle_v2.py \
            --self-test \
            --output artifacts/rust_first_runtime/rf02c/EVENT_ROOT_ORACLE_V2.json \
            | tee artifacts/rust_first_runtime/rf02c/EVENT_ROOT_ORACLE_V2.log

      - name: Preserve bounded preflight evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rf02c-preflight-${{ github.sha }}
          path: artifacts/rust_first_runtime/rf02c/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fail-closed stop boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rc='${{ steps.scope.outputs.exit_code }}'
          if [[ -z "$rc" ]]; then
            echo "RF-02C scope detector did not produce an exit code" >&2
            exit 79
          fi
          if [[ "$rc" != "0" ]]; then
            echo "RF-02C stopped before solver wiring; preflight exit code: $rc" >&2
            exit "$rc"
          fi
