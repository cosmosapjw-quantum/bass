name: CE1-O scoped MPFR C ABI and NaN fail-closed
on:
  push:
    branches: [research/bass-ce1o-mpfr-abi-finite-directed-20261029-r1]
  pull_request:
    branches: [research/bass-ce1n-mpfr-direct-api-proof-safety-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1o-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mpfr-abi-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: '.'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Frozen Python oracle requirements
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: Exact scoped 13 CE1 modules including hostile finite-MPFR inputs
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1k_canonical_source_local.py \
            tests/nonperturbative/test_ce1m_integrated_adversarial.py \
            tests/nonperturbative/test_ce1n_mpfr_program_assurance.py \
            tests/nonperturbative/test_ce1o_mpfr_finite_contract.py \
            tests/nonperturbative/test_einstein_error_budget.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_tabulated_time.py
      - name: Compile standalone C/MPFR 4.2-compatible LP64 oracle and compare 510 operation pairs
        run: |
          set -euo pipefail
          cc --version
          python research/ce1o_20261029/check_ffi.py
      - name: Installed wheel nonfinite decimal rejection and finite original interval
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1o-wheel
          python -m pip install --no-deps --target /tmp/ce1o-installed /tmp/ce1o-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1o-installed python - <<'PY'
          from bianchi.nonperturbative.einstein_interval import Interval
          for literal in ('nan','Inf','-Infinity'):
              try: Interval.decimal(literal)
              except ValueError: pass
              else: raise AssertionError('invalid interval payload admitted: '+literal)
          x=Interval.decimal('0.1')
          assert x.lower<=0.1<=x.upper
          print('CE1O_INSTALLED_WHEEL_MPFR_NONFINITE_FAIL_CLOSED_PASS')
          PY
