name: CE1-J canonical scoped variant reconciliation
on:
  push:
    branches: [research/bass-ce1j-canonical-scoped-reconcile-20261029-r1]
  pull_request:
    branches: [research/bass-ce1i-time-local-jacobian-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1j-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Pinned scoped Python oracle dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: PR243/244 contracts + CE1-G/H/I same-physics regression
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_time.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_error_budget.py
      - name: Installed wheel exact stored input smoke
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1j-wheels
          python -m pip install --no-deps --target /tmp/ce1j-wheel /tmp/ce1j-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1j-wheel python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_local import run_local_tabulated_rk4
          from bianchi.nonperturbative.einstein_interval import stored_ray_energy_majorant
          s=TabulatedRadiation([0,.5,1],[0,.25,.75,1],
            [[.1,.25,.05],[.2,.15,.15]],backend='python_oracle')
          r=run_local_tabulated_rk4(s,steps=2,end=.04,backend='python_oracle')
          assert r['production_ready'] is False and r['fixed_target_h']==1e-5
          x=stored_ray_energy_majorant(s)
          s.mass=s.mass.copy()*2
          assert stored_ray_energy_majorant(s)>1.999*x
          print('CE1J_WHEEL_SAME_PHYSICS_AND_FRESH_SOURCE_PASS')
          PY
