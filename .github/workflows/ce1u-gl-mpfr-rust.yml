name: CE1-U original-cell GL MPFR192 geometry plus BASS-native Rust
on:
  push:
    branches: [research/bass-ce1u-gl-rust-mpfr-20261030-r1]
  pull_request:
    branches: [research/bass-ce1t-original-cell-gl-rust-20261030-r1]
permissions:
  contents: read
concurrency:
  group: ce1u-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gl-source-coupled-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: '.'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Verify actual parent original source and BASS Rust identities
        run: |
          set -euo pipefail
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = 'a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84'
          test "$(git hash-object bianchi/nonperturbative/einstein_tabulated_source.py)" = 'fdeb83a65cd424786ba6bb8ddadbcb2b2e2d45bf'
          test "$(git hash-object bianchi/nonperturbative/einstein_interval.py)" = 'abbab0990fdefaf535ccbf5191ae3e060cb19214'
      - name: Frozen scientific Python dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: New rational Legendre root, MPFR source and full four-panel geometry regression
        run: |
          set -euo pipefail
          python -m pytest -q research/ce1u_20261030/tests/test_gl_source.py \
             tests/nonperturbative/test_einstein_tabulated_source.py \
             tests/nonperturbative/test_einstein_tabulated_time.py \
             tests/nonperturbative/test_einstein_tabulated_local.py
      - name: Actual stored GL4/6/8 four-panel MPFR192 coupled history
        run: |
          set -euo pipefail
          python research/ce1u_20261030/certify_gl_coupled.py 4 6 8 >/tmp/ce1u-coupled.jsonl
          python - <<'PY'
          import json
          from research.ce1u_20261030.certify_gl_coupled import certify_gl_coupled
          for n in (4,6,8):
              r=certify_gl_coupled(n)
              assert r['target_met'] and r['final_h_upper']<1e-5
              print('CE1U_GL_MPFR192_ORIGINAL_H_TARGET_MET',n,r['rays'],r['final_h_upper'])
          PY
      - name: Build original BASS Rust frame and verify binary64 source moment parity
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustc +1.94.1 --edition=2021 -C opt-level=2 -A dead_code \
             research/ce1r_20261030/sky_time_derivative.rs -o /tmp/bass_ce1u_rust
          /tmp/bass_ce1u_rust --selftest
          python research/ce1u_20261030/rust_parity.py --binary /tmp/bass_ce1u_rust
