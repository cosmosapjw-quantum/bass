name: CE1AS original sixcell vs self-consistent isotropic Vlasov FLRW
on:
  push:
    branches:
      - research/bass-ce1as-independent-flrw-20261101-r1
  pull_request:
    paths:
      - 'research/ce1as_20261101/**'
      - '.github/workflows/ce1as-physical-flrw.yml'
permissions:
  contents: read
jobs:
  physical_flrw_vs_bianchi:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      BASS_CE1AS_CI_REPLAY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install fixed physics runtime
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Replay exact owner CE1AP nine Einstein-Vlasov IVPs
        run: python research/ce1ap_20261031/source/ce1ap_remote.py
      - name: Replay owner CE1AR original-source fixed-z Bianchi optical field
        run: python research/ce1ar_20261101/source/ce1ar_remote.py
      - name: Execute independent radiation FLRW IVP and source-bound physical comparison
        run: >-
          python research/ce1as_20261101/source/ce1as_flrw_reference.py
          --ancestor research/ce1ap_20261031/data/CE1AP_DIRECTIONAL_GEODESIC.csv
          --beams research/ce1ar_20261101/data/CE1AR_FIXED_Z_REMOTE_BEAMS.csv
          --out research/ce1as_20261101/data
          --ci-replayed-source
          --ce1ap-metadata research/ce1ap_20261031/data/CE1AP_REMOTE_RESULTS.json
          --ce1ar-metadata research/ce1ar_20261101/data/CE1AR_REMOTE_RESULTS.json
      - name: Verify source physical parity and conservation with six CI tests
        run: python -m pytest -q research/ce1as_20261101/source/test_ce1as_remote.py
      - name: Generate scientific reference plots
        run: python research/ce1as_20261101/source/plot_ce1as.py
      - name: Compile Python source
        run: python -m compileall -q research/ce1as_20261101/source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AS-independent-energy-matched-FLRW-vs-original-Bianchi-physics
          path: |
            research/ce1as_20261101/data/
            research/ce1as_20261101/figures/
            research/ce1as_20261101/reports/
            research/ce1as_20261101/source/
            research/ce1ap_20261031/data/CE1AP_REMOTE_RESULTS.json
            research/ce1ar_20261101/data/CE1AR_REMOTE_RESULTS.json
          if-no-files-found: error
