name: CE1-K canonical-safe panel-local source certificate
on:
  push:
    branches: [research/bass-ce1k-canonical-local-source-20261029-r1]
  pull_request:
    branches: [research/bass-ce1j-canonical-scoped-reconcile-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1k-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Install pinned scoped Python dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Same-physics CE1-C/G/H/I/J/K targeted tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_einstein_error_budget.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_tabulated_time.py \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1k_canonical_source_local.py
      - name: Installed wheel exact binary scoped smoke
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1k-wheel
          python -m pip install --no-deps --target /tmp/ce1k-inst /tmp/ce1k-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1k-inst python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_source_canonical import run_canonical_panel_source
          s=TabulatedRadiation([0,.5,1],[0,.25,.75,1],[[.1,.25,.05],[.2,.15,.15]],backend='python_oracle')
          r=run_canonical_panel_source(s,backend='python_oracle')
          assert r['production_ready'] is False and r['upper_dag']=='9/15'
          assert r['ce1i_total_h_upper']>=r['total_h_upper']
          print('CE1K_WHEEL_SCOPED_SAME_PHYSICS_PASS')
          PY