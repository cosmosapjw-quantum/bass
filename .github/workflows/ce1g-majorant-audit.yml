name: CE1-G independent positive-ray fourth-derivative audit
on:
  push:
    branches: [research/bass-ce1g-majorant-audit-20261029]
  pull_request:
    paths:
      - bianchi/nonperturbative/einstein_interval.py
      - tests/nonperturbative/test_ce1g_positive_ray_majorant_mutation.py
      - .github/workflows/ce1g-majorant-audit.yml
permissions:
  contents: read
jobs:
  scoped-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Dependencies for scoped Python oracle
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: Exact stored-source cache invalidation and inherited CE1 regressions
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1g_positive_ray_majorant_mutation.py \
            tests/nonperturbative/test_einstein_tabulated_time.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_error_budget.py
      - name: Verify parent fixed-ref8 CE1G numerical identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_tabulated_time import run_scoped_tabulated_rk4
          source=TabulatedRadiation([0,.5,1],[0,.25,.75,1],
                  [[.1,.25,.05],[.2,.15,.15]],refinement=8,backend='python_oracle')
          r=run_scoped_tabulated_rk4(source,steps=4,end=.08,subcells=1,backend='python_oracle')
          baseline=json.loads(Path('research/ce1g_20261029/evidence/SCIENCE_RESULTS.json').read_text())[3]
          for key in ['source_pressure_upper','total_ell_h_upper',
                      'time_and_jump_ell_h_upper','max_knot_jump_h_upper']:
              assert r[key]==baseline[key],key
          print('CE1G_FIXED_PARENT_REF8_NUMERICAL_IDENTITY_PASS')
          PY
      - name: Installed wheel mutation-sensitive MPFR cap
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/bass-ce1g-audit-wheel
          python -m pip install --no-deps --target /tmp/bass-ce1g-audit-installed /tmp/bass-ce1g-audit-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/bass-ce1g-audit-installed python - <<'PY'
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation
          from bianchi.nonperturbative.einstein_interval import stored_ray_energy_majorant
          s=TabulatedRadiation([0,.5,1],[0,.25,.75,1],
               [[.1,.25,.05],[.2,.15,.15]],backend='python_oracle')
          v=stored_ray_energy_majorant(s)
          s.mass=s.mass.copy()*100
          assert stored_ray_energy_majorant(s)>=99.999*v
          print('WHEEL_FRESH_POSITIVE_RAY_MAJORANT_PASS')
          PY
