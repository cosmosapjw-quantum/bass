name: CE1-G independent majorant and Hermite-origin audit
on:
  push:
    branches: [research/bass-ce1g-independent-sourcepath-audit-20261029-r1]
  pull_request:
    branches: [research/bass-ce1g-tabulated-wholepath-20261029]
permissions:
  contents: read
concurrency:
  group: ce1g-ind-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sourcepath-adversarial:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: 3 new adversarial tests plus 72 inherited scoped regressions
        run: >-
          python -m pytest -q
          tests/nonperturbative/test_ce1g_independent_audit.py
          tests/nonperturbative/test_einstein_tabulated_time.py
          tests/nonperturbative/test_einstein_tabulated_source.py
          tests/nonperturbative/test_einstein_exponential_source.py
          tests/nonperturbative/test_einstein_physical_input.py
          tests/nonperturbative/test_einstein_interval.py
          tests/nonperturbative/test_einstein_error_budget.py
