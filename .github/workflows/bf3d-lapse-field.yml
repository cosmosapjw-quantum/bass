name: BF3D local lapse field
on:
  push:
    branches: [research/bass-bf3d-local-lapse-source-20261028]
    paths: [bianchi/nonperturbative/lapse_field.py, tests/nonperturbative/test_lapse_field.py, .github/workflows/bf3d-lapse-field.yml]
permissions:
  contents: read
jobs:
  package-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2
      - name: Test actual integrated package
        run: PYTHONPATH=. python -m pytest tests/nonperturbative/test_lapse_field.py -q --junitxml=/tmp/bf3d-tests.xml
      - name: Installed-wheel local-source equilibrium
        run: |
          python -m pip wheel --no-deps . -w /tmp/bf3d-wheel
          python -m pip install --no-deps --target /tmp/bf3d-install /tmp/bf3d-wheel/*.whl
          cd /tmp
          PYTHONPATH=/tmp/bf3d-install python - <<'PY'
          import numpy as np
          from bianchi.nonperturbative.lapse_field import FieldGrid,LapseField,PeriodicLapse,stationary
          g=FieldGrid(9,6,8);s=LapseField(g,PeriodicLapse(.35),1.,backend='python_oracle')
          y=stationary(g);out=s.split(y,.1,4).at(.1)
          assert np.max(abs(out-y))<4e-10
          print('INSTALLED_WHEEL_LAPSE_FIELD_PASS; native NOT_RUN')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bf3d-${{ github.sha }}
          path: /tmp/bf3d-tests.xml
          retention-days: 30
