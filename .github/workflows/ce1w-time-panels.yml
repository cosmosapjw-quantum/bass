name: CE1-W fixed GL6/GL8 4-8-16 panel MPFR and original BASS Rust
on:
  push:
    branches: [research/bass-ce1w-rk4-time-panels-rust-mpfr-20261030-r1]
  pull_request:
    branches: [research/bass-ce1v-dual-source-rust-mpfr-20261030-r1]
permissions:
  contents: read
concurrency:
  group: ce1w-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certified-time-panels:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      RAYON_NUM_THREADS: '1'
      CE1W_RESULT: /tmp/ce1w/science.json
      CE1W_RUST_RESULT: /tmp/ce1w/rust_parity.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Pin the original BASS Rust and exact GL physics/source proof
        run: |
          set -euo pipefail
          test "$(git hash-object _rustcore/src/kinetic/comoving.rs)" = 'a29b12b5e7b0d529bddaf9eac53cfdb984ddaa84'
          test "$(git hash-object bianchi/nonperturbative/einstein_tabulated_source.py)" = 'fdeb83a65cd424786ba6bb8ddadbcb2b2e2d45bf'
          test "$(git hash-object bianchi/nonperturbative/einstein_interval.py)" = 'abbab0990fdefaf535ccbf5191ae3e060cb19214'
          test "$(git hash-object research/ce1v_20261030/donor/GL6_source_exact_bound.json)" = '4a3442e72ccf41563464092079acf84483da9a0f'
          test "$(git hash-object research/ce1v_20261030/donor/GL8_source_exact_bound.json)" = '7cc1f9331aa532d86a71f249a9be552367c90860'
          test "$(git hash-object research/ce1v_20261030/donor/ce1u_cert_source.py)" = '0e8ef8375cf5f26a9a020d6ec878e4b77b5d0560'
          git rev-parse HEAD
          python --version
      - name: Frozen test runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 mpmath==1.3.0
      - name: Verify all CE1-W Python code compiles before any MPFR compute
        run: python -m compileall -q research/ce1w_20261030
      - name: Create S0 immutable theory/source checkpoint before expensive MPFR run
        run: |
          mkdir -p /tmp/ce1w
          python research/ce1w_20261030/package_and_report.py --stage S0 --runner /tmp/ce1w
      - name: Upload S0 Git checkpoint archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_CE1W_S0_THEORY_GIT
          path: /tmp/ce1w/BASS_CE1W_S0.zip
          retention-days: 60
      - name: Full GL6/GL8 4-8-16 RK4/Hermite each MPFR192 whole-panel Taylor + knots
        run: |
          set -euo pipefail
          python research/ce1w_20261030/time_panels.py --output /tmp/ce1w/science.json --steps 4,8,16 --subcells 1
      - name: Compile original BASS Rust kinetic and verify actual six matching time paths
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.1 --profile minimal
          rustc +1.94.1 --edition=2021 -C opt-level=2 -A dead_code \
            research/ce1r_20261030/sky_time_derivative.rs -o /tmp/ce1w_bass_original_rust
          /tmp/ce1w_bass_original_rust --selftest
          python research/ce1w_20261030/rust_multistep.py \
            --binary /tmp/ce1w_bass_original_rust \
            --certificate /tmp/ce1w/science.json \
            --output /tmp/ce1w/rust_parity.json
      - name: Data-backed test suite on six real completed MPFR and native Rust runs
        run: |
          set -euo pipefail
          python -m pytest -q research/ce1w_20261030/tests/test_panel_certificate.py
          python -m compileall -q research/ce1w_20261030
      - name: Create S1 source/science/native proof checkpoint with member SHA256
        run: python research/ce1w_20261030/package_and_report.py --stage S1 --runner /tmp/ce1w
      - name: Upload S1 original BASS native Rust and MPFR192 evidence ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_CE1W_S1_RUST_MPFR_SCIENCE
          path: /tmp/ce1w/BASS_CE1W_S1.zip
          retention-days: 60
      - name: Generate S2 Korean report, complete evidence manifest, copyable handoff
        run: |
          set -euo pipefail
          python research/ce1w_20261030/package_and_report.py --stage S2 --runner /tmp/ce1w
      - name: Upload S2 final comprehensive checkpoint
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BASS_CE1W_S2_REPORT_HANDOFF
          path: /tmp/ce1w/BASS_CE1W_S2.zip
          retention-days: 60
