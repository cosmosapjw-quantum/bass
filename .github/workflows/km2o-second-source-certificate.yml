name: BASS KM2O dossier VigilODE original full-ten-epoch second Thomson science
on:
  push:
    branches: [research/bass-km2o-dossier-vigilode-second-thomson-20261031-r1]
  pull_request:
    branches: [research/bass-km2n-once-scattered-retarded-lya-20261031-r1]
permissions:
  contents: read
  actions: read
jobs:
  second_gain_real_owner_full10:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: '.:research/dual_lane_km2c_20261028/vendor:research/dual_lane_km2c_20261028/code'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      KM2O_SCIENCE: 'research/dual_lane_km2o_dossier_20261031/KM2O_FULL_SCIENCE.json'
      KM2O_AUDIT: 'research/dual_lane_km2o_dossier_20261031/KM2O_HOSTILE_FULL_AUDIT.json'
      KM2N_SCIENCE_JSON: 'research/dual_lane_km2n_20261031/results/KM2N_ONCE_SCATTER_REAL.json'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Source-scoped exact original Python and numerical runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 pytest==9.0.2
      - name: Download immutable original GL12 and GL16 KM2N source science, never re-solve owner IVPs
        uses: actions/download-artifact@v4
        with:
          name: KM2N_S2_ALL_SOURCE_PHYSICS_AND_REFEREE
          run-id: 41181695902
          repository: cosmosapjw-quantum/bass
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/km2o_frozen_original
      - name: Verify all 50 original owner science source SHA and ZIP CRC; fail closed
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,hashlib,json,zipfile
          source=list(pathlib.Path('/tmp/km2o_frozen_original').rglob('KM2N_S2_COMPLETE_SOURCE_SCIENCE.zip'))
          if len(source)!=1:raise RuntimeError('original immutable owner archive missing')
          with zipfile.ZipFile(source[0]) as z:
              if z.testzip():raise ArithmeticError('original owner CRC changed')
              m=json.loads(z.read('MANIFEST.json'))
              if m['git_source_HEAD']!='4137f942d2a95999f4e6627b71042e98f7afc1b7' or len(m['members'])!=50:
                  raise ArithmeticError('different original BASS scientific owner')
              for path,info in m['members'].items():
                  content=z.read(path)
                  if hashlib.sha256(content).hexdigest()!=info['sha256']:
                      raise ArithmeticError('original source SHA changed '+path)
                  p=pathlib.Path(path);p.parent.mkdir(exist_ok=True,parents=True)
                  if p.exists():
                      if p.read_bytes()!=content:raise ArithmeticError('IMMUTABLE_OWNER_MUTATION '+path)
                  else:p.write_bytes(content)
              pathlib.Path('MANIFEST.json').write_bytes(z.read('MANIFEST.json'))
          print('KM2O_TRUE_OWNER_SOURCE_FILES',len(m['members']),flush=True)
          PY
          test "$(git hash-object research/dual_lane_km2n_20261031/once_scattered.py)" = 2e8fd0858aa38903beb4759b9fb54a574aeb8cfa
          python -m compileall -q research/dual_lane_km2o_dossier_20261031
      - name: S0 complete BASS mathematical dossier VigilODE crosswalk and exact source checkpoint
        run: |
          mkdir -p /tmp/km2o_final
          python research/dual_lane_km2o_dossier_20261031/ARCHIVE_BUILD.py --stage S0 --output /tmp/km2o_final/KM2O_S0_SOURCE_DOSSIER.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2O_S0_DOSSIER_DAG_SOURCE
          path: /tmp/km2o_final/KM2O_S0_SOURCE_DOSSIER.zip
          retention-days: 60
      - name: Generate ten real GL12 GL16 original owner second Thomson polarized spectra
        run: |
          python research/dual_lane_km2o_dossier_20261031/replay_second_gain_full.py --output "$KM2O_SCIENCE"
      - name: Generate 12000 physical spectral rows and six scientific plots
        run: |
          python research/dual_lane_km2o_dossier_20261031/make_full_gain_plots.py --source "$KM2O_SCIENCE" --output research/dual_lane_km2o_dossier_20261031/figures
      - name: Source-backed BASS second gain 12 physics tests and original 13 regression tests
        run: |
          python -m pytest -q research/dual_lane_km2o_dossier_20261031/tests/test_full_second_gain.py research/dual_lane_km2n_20261031/tests/test_once_scattered.py
      - name: S1 archive all real spectra, original science, factorized photon coherencies and figures
        run: |
          python research/dual_lane_km2o_dossier_20261031/ARCHIVE_BUILD.py --stage S1 --output /tmp/km2o_final/KM2O_S1_REAL_PHYSICAL_SPECTRA.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2O_S1_REAL_POLARIZED_PHYSICS
          path: /tmp/km2o_final/KM2O_S1_REAL_PHYSICAL_SPECTRA.zip
          retention-days: 60
      - name: Independent direct polarized Thomson pairwise-kernel source audit without BASS RHS
        run: |
          python research/dual_lane_km2o_dossier_20261031/hostile_full_gain_audit.py --source "$KM2O_SCIENCE" --output "$KM2O_AUDIT"
      - name: Optimized Python explicit-exception same-source independent hostile physics audit
        run: |
          python -O research/dual_lane_km2o_dossier_20261031/hostile_full_gain_audit.py --source "$KM2O_SCIENCE" --output /tmp/km2o_final/HOSTILE_AUDIT_OPTIMIZED.json
      - name: Generate scope-locked science report and next-thread handoff
        run: |
          python research/dual_lane_km2o_dossier_20261031/generate_final_report.py --source "$KM2O_SCIENCE" --audit "$KM2O_AUDIT" --dag research/dual_lane_km2o_dossier_20261031/DAG_RECONCILED.json --outdir research/dual_lane_km2o_dossier_20261031
      - name: S2 original source plus full physics, independent audit, readback and DAG handoff
        run: |
          python research/dual_lane_km2o_dossier_20261031/ARCHIVE_BUILD.py --stage S2 --output /tmp/km2o_final/KM2O_S2_FULL_SCIENCE.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2O_S2_FULL_SOURCE_AND_PHYSICS_HANDOFF
          path: |
            /tmp/km2o_final/KM2O_S2_FULL_SCIENCE.zip
            research/dual_lane_km2o_dossier_20261031/S2_FINAL_REPORT_KO.md
            research/dual_lane_km2o_dossier_20261031/HANDOFF_NEXT_KO.txt
          retention-days: 60
