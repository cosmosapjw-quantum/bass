name: KM2H FLRW source-qualified recombination frozen-evidence regression
on:
  push:
    branches: [research/bass-km2h-source-qualified-recomb-opacity-20261030-r1]
  pull_request:
    branches: [research/bass-km2g-neutral-electron-proton-einstein-20261030-r1]
permissions:
  contents: read
jobs:
  frozen-FLRW-evidence-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned regression tools
        run: python -m pip install numpy==2.3.5 pytest==9.0.2
      - name: Validate preserved FLRW native-output physical table (not native rebuild)
        run: |
          python -m pytest -q research/dual_lane_km2h_20261030/test_flrw_frozen_evidence.py
          sha256sum research/dual_lane_km2h_20261030/source_data/flrw_regression_evidence.json
          sha256sum research/dual_lane_km2h_20261030/source_data/flrw_recombination_regression_1to1600.csv
      - name: Preserve frozen FLRW comparison table and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2H_FLRW_FROZEN_EVIDENCE_NOT_NATIVE_REBUILD
          path: |
            research/dual_lane_km2h_20261030/source_data/flrw_regression_evidence.json
            research/dual_lane_km2h_20261030/source_data/flrw_recombination_regression_1to1600.csv
            research/dual_lane_km2h_20261030/source_data/FLRW_FROZEN_MANIFEST.json
          retention-days: 60
          if-no-files-found: error
