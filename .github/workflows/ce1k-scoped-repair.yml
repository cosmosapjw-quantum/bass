name: CE1-K hostile input and frozen contract regression
on:
  push:
    branches: [repair/bass-ce1k-shape-rf-ci-20261029-r1]
  pull_request:
    branches: [research/bass-ce1j-canonical-scoped-reconcile-20261029-r1]
permissions:
  contents: read
concurrency:
  group: ce1k-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scoped-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.13.5'}
      - name: Frozen Python oracle dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 mpmath==1.3.0 pytest==9.0.2
      - name: Hostile RED-fixed source + original CE1-G/H/I tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/nonperturbative/test_ce1k_cardinality_contract.py \
            tests/nonperturbative/test_ce1j_variant_contract.py \
            tests/nonperturbative/test_ce1g_independent_audit.py \
            tests/nonperturbative/test_einstein_tabulated_local.py \
            tests/nonperturbative/test_einstein_tabulated_sharp.py \
            tests/nonperturbative/test_einstein_tabulated_time.py \
            tests/nonperturbative/test_einstein_tabulated_source.py \
            tests/nonperturbative/test_einstein_exponential_source.py \
            tests/nonperturbative/test_einstein_physical_input.py \
            tests/nonperturbative/test_einstein_interval.py \
            tests/nonperturbative/test_einstein_error_budget.py
      - name: Frozen RF-BENCH adapter / corpus / runner contract
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_rfbench00_corpus_runner.py
          python - <<'PY'
          from benchmarks.rfbench.corpus import ADAPTER_PATH, load_registry, sha256_file
          from benchmarks.rfbench.runner import EXPECTED_ADAPTER_SHA256
          assert sha256_file(ADAPTER_PATH) == load_registry()['source_adapter_sha256'] == EXPECTED_ADAPTER_SHA256
          print('RF_BENCH_ADAPTER_FROZEN_BYTES_PASS')
          PY
      - name: Installed wheel rejects mismatched source topology
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps . -w /tmp/ce1k-wheels
          python -m pip install --no-deps --target /tmp/ce1k-installed /tmp/ce1k-wheels/*.whl
          cd /tmp
          PYTHONPATH=/tmp/ce1k-installed python - <<'PY'
          import numpy as np
          from bianchi.nonperturbative.einstein_tabulated_source import TabulatedRadiation, certified_tabulated_pressure
          source=TabulatedRadiation([0,1],[0,1],[[.9]],backend='python_oracle')
          source.n=np.vstack([source.n,np.array([1.,0.,0.])])
          source.mass=np.append(source.mass,1.)
          try:
              certified_tabulated_pressure(source,[.08]*3)
          except ValueError as err:
              assert 'cardinality' in str(err)
          else:
              raise AssertionError('false positive certificate admitted by installed wheel')
          print('CE1K_WHEEL_CARDINALITY_FAIL_CLOSED_PASS')
          PY
