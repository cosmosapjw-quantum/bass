name: KM2J self-consistent Einstein P8 and chemical binding fourforce
on:
  push:
    branches: [research/bass-km2j-chem-p8-energy-feedback-20261031-r1]
  pull_request:
    branches: [research/bass-km2i-lya-peebles-bianchi-rates-20261031-r1]
permissions:
  contents: read
jobs:
  coupled_bianchi_chemistry:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONPATH: '.'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      KM2J_SCIENCE_JSON: research/dual_lane_km2j_20261031/results/KM2J_COUPLED_PHYSICS_2GRID.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13.5'
      - name: Install pinned numerical test runtime
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 pytest==9.0.2
      - name: Verify immutable source identity, compile and primary chemistry contracts
        run: |
          set -euo pipefail
          test "$(git hash-object research/dual_lane_km2i_20261031/lya_peebles.py)" = 288762c51643855fc6d5a12fc04a911062abd449
          test "$(git hash-object research/dual_lane_km2h_20261030/external_opacity_bianchi.py)" = fc9d96112305699ceba71032a1b119bc7e55549a
          test "$(git hash-object research/dual_lane_km2f_20261030/einstein_bianchi.py)" = 457790df7aba6d82326ac6f3be5814851b970b1d
          python -m compileall -q research/dual_lane_km2j_20261031
          python -c 'from research.dual_lane_km2j_20261031.coupled_chem_p8 import guard_all; print("KM2J_SOURCE_GUARDS",len(guard_all()))'
      - name: S0 theory source complete checkpoint
        run: |
          mkdir -p /tmp/km2j_ci
          python research/dual_lane_km2j_20261031/ARCHIVE_BUILD.py --stage S0 --output /tmp/km2j_ci/KM2J_S0_THEORY.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2J_S0_FROZEN_THEORY_SOURCE
          path: /tmp/km2j_ci/KM2J_S0_THEORY.zip
          retention-days: 60
      - name: Integrate actual joint Einstein polarized P8 Peebles IVPs on two quadratures
        run: |
          python research/dual_lane_km2j_20261031/coupled_chem_p8.py --orders 12,16 --output "$KM2J_SCIENCE_JSON"
      - name: Generate source-backed 164-epoch physical table and six science plots
        run: |
          python research/dual_lane_km2j_20261031/make_plots.py --source "$KM2J_SCIENCE_JSON" --output research/dual_lane_km2j_20261031/figures
      - name: S1 real joint physics source and plot archive
        run: |
          python research/dual_lane_km2j_20261031/ARCHIVE_BUILD.py --stage S1 --output /tmp/km2j_ci/KM2J_S1_COUPLED_PHYSICS.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2J_S1_REAL_COUPLED_SCIENCE
          path: /tmp/km2j_ci/KM2J_S1_COUPLED_PHYSICS.zip
          retention-days: 60
      - name: Verify physics conservation and exact discrete chemical fourforce on same actual cases
        run: |
          python -m pytest -q research/dual_lane_km2j_20261031/tests/test_coupled_chem_p8.py
      - name: Recheck scientific code under Python optimized execution
        run: |
          python -O -m pytest -q research/dual_lane_km2j_20261031/tests/test_coupled_chem_p8.py
      - name: S2 complete source, results and audit-compatible handoff
        run: |
          python research/dual_lane_km2j_20261031/ARCHIVE_BUILD.py --stage S2 --output /tmp/km2j_ci/KM2J_S2_SOURCE_SCIENCE.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: KM2J_S2_SOURCE_SCIENCE_AND_RESULTS
          path: |
            /tmp/km2j_ci/KM2J_S2_SOURCE_SCIENCE.zip
            research/dual_lane_km2j_20261031/results/KM2J_COUPLED_PHYSICS_2GRID.json
            research/dual_lane_km2j_20261031/figures/KM2J_4LIVE_IVPS_164_EPOCHS.csv
          retention-days: 60
