name: CE1AN original six-cell finite-source curvature and anisotropic work
on:
  push:
    branches:
      - research/bass-ce1an-finite-source-curvature-work-20261031-r1
  pull_request:
    paths:
      - 'research/ce1an_20261031/**'
      - '.github/workflows/ce1an-finite-source-work.yml'
jobs:
  ce1an_source_owned_physics:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install controlled scientific dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0 pytest==9.0.2 matplotlib==3.10.8
      - name: Execute 24 new positive original-source Einstein-Vlasov nonlinear and tangent IVPs
        run: python research/ce1an_20261031/source/ce1an_remote.py
      - name: Verify actual constraint, Weyl/Ricci, finite differences and first law
        run: python -m pytest -q research/ce1an_20261031/source/test_ce1an_remote.py
      - name: Verify code imports and syntax
        run: python -m compileall -q research/ce1an_20261031/source
      - name: Upload original physical data and immutable science records
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CE1AN-original-six-cell-finite-amplitude-curvature-physics
          path: |
            research/ce1an_20261031/source/*.py
            research/ce1an_20261031/data/*.csv
            research/ce1an_20261031/data/*.json
            research/ce1an_20261031/*.md
            research/ce1an_20261031/*.json
          if-no-files-found: error
