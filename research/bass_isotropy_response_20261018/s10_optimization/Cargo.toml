[package]
name = "bass-s10-optimization"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT"
description = "Opt-in ordered BASS S9 callback variants with fixed scientific owners"

[features]
default = []
allocation-probe = []

# Runtime sibling layout matches the already verified S9 preparation layout.
# Neither this manifest nor its source patches the original S9 or VigilODE.
[dependencies]
bass-s9-vigilode = { path = "../s9_vigilode" }
rodas5p-core = { path = "../../vigilode/crates/rodas5p-core" }
rodas5p-integrators = { path = "../../vigilode/crates/rodas5p-integrators" }
rayon = "=1.12.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[profile.dev]
opt-level = 1
debug = 0
incremental = false
codegen-units = 1

[profile.release]
opt-level = 2
debug = 0
incremental = false
codegen-units = 1
lto = false

[workspace]
