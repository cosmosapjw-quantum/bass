<svg xmlns="http://www.w3.org/2000/svg" width="820" height="510" viewBox="0 0 820 510" role="img" aria-labelledby="title desc">
  <title id="title">Active REC lineage versus BASS fourteen-formula geometry export</title>
  <desc id="desc">Thirteen BASS formulas have no active REC rederivation, one is a dependency only, and none has duplicate REC authority.</desc>
  <rect x="0" y="0" width="820" height="510" fill="white"/>
  <text x="410" y="34" text-anchor="middle" font-family="sans-serif" font-size="21">Active REC lineage versus BASS 14-formula geometry export</text>
  <line x1="75" y1="410" x2="775" y2="410" stroke="black" stroke-width="2"/>
  <line x1="75" y1="70" x2="75" y2="410" stroke="black" stroke-width="2"/>
  <g font-family="sans-serif" font-size="13" fill="black">
    <text x="63" y="415" text-anchor="end">0</text><text x="63" y="340" text-anchor="end">3</text>
    <text x="63" y="265" text-anchor="end">6</text><text x="63" y="190" text-anchor="end">9</text>
    <text x="63" y="115" text-anchor="end">12</text>
  </g>
  <g fill="#666" stroke="black" stroke-width="1">
    <rect x="135" y="85" width="150" height="325"/>
    <rect x="355" y="385" width="150" height="25"/>
    <rect x="575" y="410" width="150" height="0"/>
  </g>
  <g font-family="sans-serif" fill="black" text-anchor="middle">
    <text x="210" y="75" font-size="18">13/14</text><text x="430" y="375" font-size="18">1/14</text>
    <text x="650" y="395" font-size="18">0/14</text>
    <text x="210" y="440" font-size="13">No active REC</text><text x="210" y="457" font-size="13">rederivation</text>
    <text x="430" y="440" font-size="13">Dependency</text><text x="430" y="457" font-size="13">only</text>
    <text x="650" y="440" font-size="13">Duplicate</text><text x="650" y="457" font-size="13">authority</text>
  </g>
  <text x="20" y="250" transform="rotate(-90 20 250)" text-anchor="middle" font-family="sans-serif" font-size="15">formula count</text>
</svg>
