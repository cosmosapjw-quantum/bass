<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">SYNC-MAP-02B REC relation classification</title>
  <desc id="desc">Four pending BASS imports, one REC specialization, two REC-owned extensions, and two independent oracles among nine classified relations.</desc>
  <rect x="0" y="0" width="900" height="520" fill="white"/>
  <text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="22">SYNC-MAP-02B: REC relation classification</text>
  <line x1="70" y1="420" x2="850" y2="420" stroke="black" stroke-width="2"/>
  <line x1="70" y1="80" x2="70" y2="420" stroke="black" stroke-width="2"/>
  <g font-family="sans-serif" font-size="14" fill="black">
    <text x="58" y="425" text-anchor="end">0</text><text x="58" y="345" text-anchor="end">1</text>
    <text x="58" y="265" text-anchor="end">2</text><text x="58" y="185" text-anchor="end">3</text>
    <text x="58" y="105" text-anchor="end">4</text>
  </g>
  <g fill="#666" stroke="black" stroke-width="1">
    <rect x="115" y="100" width="120" height="320"/>
    <rect x="315" y="340" width="120" height="80"/>
    <rect x="515" y="260" width="120" height="160"/>
    <rect x="715" y="260" width="120" height="160"/>
  </g>
  <g font-family="sans-serif" fill="black" text-anchor="middle">
    <text x="175" y="90" font-size="18">4/9</text><text x="375" y="330" font-size="18">1/9</text>
    <text x="575" y="250" font-size="18">2/9</text><text x="775" y="250" font-size="18">2/9</text>
    <text x="175" y="447" font-size="13">Pending BASS</text><text x="175" y="464" font-size="13">EquationIR import</text>
    <text x="375" y="447" font-size="13">REC adapter</text><text x="375" y="464" font-size="13">specialization</text>
    <text x="575" y="447" font-size="13">REC-owned</text><text x="575" y="464" font-size="13">extension</text>
    <text x="775" y="447" font-size="13">Independent</text><text x="775" y="464" font-size="13">oracle</text>
  </g>
  <text x="18" y="260" transform="rotate(-90 18 260)" text-anchor="middle" font-family="sans-serif" font-size="15">relation count</text>
</svg>
