<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SYNC-MAP-02C corrected impact DAG</title>
  <desc id="desc">Two independent upstream lanes converge on the REI anisotropic group redshift closure. The formula lane exports BASS energy drift and direction flow. The background lane implements BG-02 and publishes an exact numerical background lock. Runtime bridge and capacity gates also feed the first canonical interval, which alone feeds provider export.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="black"/></marker>
  </defs>
  <rect width="1200" height="650" fill="white"/>
  <text x="600" y="35" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="bold">SYNC-MAP-02C corrected impact DAG</text>
  <text x="600" y="62" text-anchor="middle" font-family="sans-serif" font-size="15">Formula export and numerical background admission remain separate</text>

  <text x="50" y="115" font-family="sans-serif" font-size="18" font-weight="bold">Formula / transport lane</text>
  <g fill="#f2f2f2" stroke="black" stroke-width="1.5" font-family="sans-serif" font-size="14">
    <rect x="50" y="140" width="220" height="70" rx="8"/><text x="160" y="168" text-anchor="middle">BASS photon formulas</text><text x="160" y="190" text-anchor="middle">energy drift + direction flow</text>
    <rect x="335" y="140" width="220" height="70" rx="8"/><text x="445" y="168" text-anchor="middle">FED shared frame/photon</text><text x="445" y="190" text-anchor="middle">FormulaIR export</text>
  </g>
  <line x1="270" y1="175" x2="335" y2="175" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="50" y="295" font-family="sans-serif" font-size="18" font-weight="bold">Background / artifact lane</text>
  <g fill="#f2f2f2" stroke="black" stroke-width="1.5" font-family="sans-serif" font-size="14">
    <rect x="50" y="320" width="180" height="70" rx="8"/><text x="140" y="348" text-anchor="middle">BASS BG-02</text><text x="140" y="370" text-anchor="middle">implementation</text>
    <rect x="280" y="320" width="240" height="70" rx="8"/><text x="400" y="348" text-anchor="middle">BASS background provider</text><text x="400" y="370" text-anchor="middle">schema + exact lock</text>
    <rect x="570" y="320" width="210" height="70" rx="8"/><text x="675" y="348" text-anchor="middle">REI BASS numerical</text><text x="675" y="370" text-anchor="middle">background lock</text>
  </g>
  <line x1="230" y1="355" x2="280" y2="355" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="355" x2="570" y2="355" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <g fill="#e8e8e8" stroke="black" stroke-width="2" font-family="sans-serif" font-size="14">
    <rect x="850" y="205" width="260" height="90" rx="8"/><text x="980" y="235" text-anchor="middle">REI anisotropic group</text><text x="980" y="257" text-anchor="middle">redshift closure</text><text x="980" y="279" text-anchor="middle">not implemented</text>
    <rect x="850" y="430" width="260" height="90" rx="8"/><text x="980" y="460" text-anchor="middle">REI first canonical interval</text><text x="980" y="482" text-anchor="middle">blocked</text><text x="980" y="504" text-anchor="middle">no provider promotion</text>
    <rect x="850" y="565" width="260" height="55" rx="8"/><text x="980" y="598" text-anchor="middle">REI provider export — blocked</text>
  </g>
  <line x1="555" y1="175" x2="850" y2="235" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="780" y1="355" x2="850" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="295" x2="980" y2="430" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="980" y1="520" x2="980" y2="565" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <g fill="#ffffff" stroke="black" stroke-dasharray="7,5" stroke-width="1.5" font-family="sans-serif" font-size="14">
    <rect x="560" y="455" width="210" height="65" rx="8"/><text x="665" y="482" text-anchor="middle">REI runtime bridge repair</text><text x="665" y="504" text-anchor="middle">ntpath blocker</text>
    <rect x="560" y="555" width="210" height="65" rx="8"/><text x="665" y="582" text-anchor="middle">REI capacity path</text><text x="665" y="604" text-anchor="middle">fail-closed gate</text>
  </g>
  <line x1="770" y1="487" x2="850" y2="470" stroke="black" stroke-width="1.8" marker-end="url(#arrow)"/>
  <line x1="770" y1="587" x2="850" y2="495" stroke="black" stroke-width="1.8" marker-end="url(#arrow)"/>

  <text x="50" y="630" font-family="sans-serif" font-size="13">Dashed nodes are independent blockers. An H-only FLRW group-redshift path is a control, not the anisotropic closure shown here.</text>
</svg>
