    <rect x="360" y="198" width="96" height="50" fill="#72b7b2"/>
    <rect x="360" y="278" width="192" height="50" fill="#f2cf5b"/>
    <rect x="360" y="358" width="480" height="50" fill="#e45756"/>
  </g>
  <g font-family="sans-serif" font-size="26" font-weight="700" fill="#111111">
