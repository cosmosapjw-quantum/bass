<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">SYNC-MAP-02D HTT relation classes</title>
  <desc id="desc">Horizontal bars show four pending BASS imports, one HTT adapter specialization, two independent oracles, and five HTT-owned processed extensions, for twelve relations total.</desc>
  <rect width="960" height="540" fill="#ffffff"/>
