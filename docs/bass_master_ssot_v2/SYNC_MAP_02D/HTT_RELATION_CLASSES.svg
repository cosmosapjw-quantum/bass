  <g font-family="sans-serif" font-size="20" fill="#333333" text-anchor="middle">
    <text x="360" y="482">0</text>
    <text x="456" y="482">1</text>
    <text x="552" y="482">2</text>
    <text x="648" y="482">3</text>
    <text x="744" y="482">4</text>
    <text x="840" y="482">5</text>
