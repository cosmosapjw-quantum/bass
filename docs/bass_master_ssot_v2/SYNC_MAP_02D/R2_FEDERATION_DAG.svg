<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc">
  <title id="title">R2 four-repository formula-federation prerequisite graph</title>
  <desc id="desc">BASS 02A and REC 02B precede parallel REI 02C and HTT 02D relation classifications. Both classifications are mandatory before the BASS shared frame and photon export. A cross-repository semantic graph follows the export, then three repository sync nodes join at a manual sync gate.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#222222"/>
    </marker>
    <style>
      .node { stroke:#222222; stroke-width:2.2; rx:14; ry:14; }
      .edge { fill:none; stroke:#222222; stroke-width:2.5; marker-end:url(#arrow); }
      .manual { fill:none; stroke:#555555; stroke-width:2.5; stroke-dasharray:10 7; marker-end:url(#arrow); }
      .label { font-family:sans-serif; font-size:24px; fill:#111111; text-anchor:middle; }
      .small { font-family:sans-serif; font-size:20px; fill:#333333; text-anchor:middle; }
    </style>
  </defs>
  <rect width="1400" height="930" fill="#ffffff"/>
  <text x="700" y="44" class="label" font-size="31" font-weight="700">R2 federation prerequisite structure</text>
  <text x="700" y="76" class="small">proposal-only graph; no provider or science promotion</text>

  <rect class="node" x="560" y="105" width="280" height="72" fill="#dbe9f6"/>
  <text x="700" y="136" class="label" font-weight="700">02A BASS</text>
  <text x="700" y="163" class="small">EquationIR export — COMPLETE</text>

  <rect class="node" x="560" y="220" width="280" height="72" fill="#dbe9f6"/>
  <text x="700" y="251" class="label" font-weight="700">02B REC</text>
  <text x="700" y="278" class="small">relation map — COMPLETE</text>

  <rect class="node" x="250" y="350" width="360" height="82" fill="#fff0c7"/>
  <text x="430" y="383" class="label" font-weight="700">02C REI</text>
  <text x="430" y="413" class="small">relation classification — READY</text>

  <rect class="node" x="790" y="350" width="360" height="82" fill="#dff2e1"/>
  <text x="970" y="383" class="label" font-weight="700">02D HTT</text>
  <text x="970" y="413" class="small">Draft PR #97 / symbolic PASS</text>

  <rect class="node" x="500" y="500" width="400" height="86" fill="#f5d8d7"/>
  <text x="700" y="534" class="label" font-weight="700">02E BASS shared export</text>
  <text x="700" y="565" class="small">BLOCKED until 02C + 02D</text>

  <rect class="node" x="500" y="640" width="400" height="82" fill="#eeeeee"/>
  <text x="700" y="673" class="label" font-weight="700">02F semantic graph</text>
  <text x="700" y="703" class="small">BLOCKED after exact export</text>

  <rect class="node" x="120" y="785" width="300" height="72" fill="#eeeeee"/>
  <text x="270" y="816" class="label" font-weight="700">SYNC-REC-01</text>
  <text x="270" y="843" class="small">exact imports/oracles</text>

  <rect class="node" x="550" y="785" width="300" height="72" fill="#eeeeee"/>
  <text x="700" y="816" class="label" font-weight="700">SYNC-REI-01</text>
  <text x="700" y="843" class="small">exact imports/oracles</text>

  <rect class="node" x="980" y="785" width="300" height="72" fill="#eeeeee"/>
  <text x="1130" y="816" class="label" font-weight="700">SYNC-HTT-01A</text>
  <text x="1130" y="843" class="small">consumer/import binding</text>

  <rect class="node" x="550" y="875" width="300" height="46" fill="#ffffff" stroke-dasharray="9 6"/>
  <text x="700" y="906" class="label" font-weight="700">SYNC-GATE-01 — MANUAL</text>

  <path class="edge" d="M700 177 L700 220"/>
  <path class="edge" d="M650 292 C620 320 520 327 470 350"/>
  <path class="edge" d="M750 292 C780 320 880 327 930 350"/>
  <path class="edge" d="M430 432 C430 475 590 474 650 500"/>
  <path class="edge" d="M970 432 C970 475 810 474 750 500"/>
  <path class="edge" d="M700 586 L700 640"/>
  <path class="edge" d="M620 722 C540 755 365 752 300 785"/>
  <path class="edge" d="M700 722 L700 785"/>
  <path class="edge" d="M780 722 C860 755 1035 752 1100 785"/>
  <path class="manual" d="M270 857 C340 886 470 887 550 895"/>
  <path class="manual" d="M700 857 L700 875"/>
  <path class="manual" d="M1130 857 C1060 886 930 887 850 895"/>

  <g transform="translate(1010 105)">
    <rect x="0" y="0" width="330" height="150" rx="12" fill="#fafafa" stroke="#999999"/>
    <text x="165" y="30" class="small" font-weight="700">Load-bearing rule</text>
    <text x="165" y="62" class="small">Acyclicity alone is insufficient.</text>
    <text x="165" y="92" class="small">Both 02C→02E and 02D→02E</text>
    <text x="165" y="120" class="small">are mandatory checked edges.</text>
  </g>
</svg>
