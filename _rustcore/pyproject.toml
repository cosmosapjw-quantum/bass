[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bianchi-rustcore"
version = "0.1.0"
description = "Rust compute core (ray tracing) for the Bianchi background cosmology solver."
requires-python = ">=3.9"
classifiers = ["Programming Language :: Rust"]

[tool.maturin]
# Standalone extension module `bianchi_rustcore` for R0/R1.
# Future: fold into the `bianchi._rustcore` submodule via maturin mixed layout (plan §2).
module-name = "bianchi_rustcore"
# Enable the PyO3 extension-module feature only for the Python build (not `cargo test`).
features = ["extension-module"]
